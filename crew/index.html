  /* ===== photos ===== */
  function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
  async function toThumb(file, size) {
    size = size || (sharedMode() ? 240 : 320);
    const img = await loadImg(await SWT.u.readAs(file, 'url'));
    const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = Math.max(0, (img.height - s) / 2 * 0.55);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, sx, sy, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', sharedMode() ? 0.8 : 0.84);
  }
  function pickFiles(accept, multiple) {
    return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = !!multiple; i.onchange = () => res([...i.files]); i.click(); });
  }
  async function photoFor(pid) {
    if (SWT.readOnly) { toast('You can view this board but not change it.'); return; }
    const [file] = await pickFiles('image/*'); if (!file) return;
    try { SWT.store.setPhoto(pid, await toThumb(file)); SWT.persist(true); toast('Photo saved.'); UI.refresh(); SWT.tv && SWT.tv.refresh(); }
    catch (e) { toast('That image could not be read.'); }
  }
  async function photosBulk() {
    if (SWT.readOnly) { toast('You can view this board but not change it.'); return; }
    modal({
      title: 'Add crew photos', body: `<p style="margin:0 0 10px">Pick many photos at once. Name each file with the person's <b>H number</b> (for example <span class="hno">H325223.jpg</span>) or their name as on the list. Photos are cropped square and ${sharedMode() ? 'shared with everyone on the board' : 'stored in this browser'}.</p>
        <div class="drop-zone" data-dz>${ic('image', 'lg')}<div style="margin-top:6px">Drop photos here or <button class="btn sm" data-pick>choose files</button></div></div><div data-res style="margin-top:12px"></div>`,
      foot: `<button class="btn" data-x2>Close</button>`,
      onOpen(m, close) {
        m.querySelector('[data-x2]').onclick = close;
        const run = async files => {
          let ok = 0; const miss = [];
          for (const file of files) {
            const base = file.name.replace(/\.[^.]+$/, '');
            const hm = /\bh[a-z]?\d{5,6}\b/i.exec(base);
            let p = hm ? SWT.DB.people.find(x => x.h && x.h.toUpperCase() === hm[0].toUpperCase()) : null;
            if (!p) { const t = SWT.planner.toks(base.replace(/[_\.]/g, ' ')); const c = SWT.DB.people.filter(x => { const pt = SWT.planner.toks(x.name); return t.length >= 2 && t.every(a => pt.some(b => SWT.planner.near(a, b))); }); if (c.length === 1) p = c[0]; }
            if (!p) { miss.push(file.name); continue; }
            try { SWT.store.setPhoto(p.id, await toThumb(file)); ok++; } catch (e) { miss.push(file.name); }
          }
          SWT.persist(true); UI.refresh(); SWT.tv && SWT.tv.refresh();
          m.querySelector('[data-res]').innerHTML = `<p style="margin:0"><b>${ok} photo${ok === 1 ? '' : 's'} matched.</b>${miss.length ? ` Not matched: ${miss.map(esc).join(', ')}. Rename them with the H number and try again, or add from the person's profile.` : ''}</p>`;
        };
        m.querySelector('[data-pick]').onclick = async () => run(await pickFiles('image/*', true));
        const dz = m.querySelector('[data-dz]');
        dz.ondragover = e => { e.preventDefault(); dz.classList.add('hot'); }; dz.ondragleave = () => dz.classList.remove('hot');
        dz.ondrop = e => { e.preventDefault(); dz.classList.remove('hot'); run([...e.dataTransfer.files].filter(f => /^image\//.test(f.type))); };
      }
    });
  }
  async function logoUp() {
    if (!canAdmin()) { toast('Only editors of this board change the logo.'); return; }
    const [file] = await pickFiles('image/*'); if (!file) return;
    const img = await loadImg(await SWT.u.readAs(file, 'url'));
    const h = Math.min(160, img.height), w = Math.round(img.width * h / img.height);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    SWT.DB.settings.logo = c.toDataURL('image/png'); SWT.persist(true); UI.refresh(); SWT.tv && SWT.tv.refresh(); toast('Logo saved.');
  }

  /* ===== import / export ===== */
  const stamp = () => D.today();
  function exportXlsx() {
    const H = { today: D.today(), todayShort: D.fmt(D.today()), company: SWT.DB.settings.company, abbr: SWT.abbr, group: p => SWT.group(p), onDuty: p => SWT.duty(p.status), statusLabel: SWT.statusLabel, statusOrder: SWT.statusOrder, assignment: SWT.assignment, locationText: SWT.locationText };
    const blob = SWT.xlsx.write(SWT.planner.exportSheets(SWT.DB, H));
    SWT.saveFile(`SWT_Daily_Planner_${stamp()}.xlsx`, blob).then(ok => ok && toast('Planner exported.'));
  }
  function payload(extra = {}) { return Object.assign({ kind: 'snapshot', savedAt: new Date().toISOString(), db: SWT.DB, photos: Object.fromEntries(SWT.store.photos) }, extra); }
  function exportHTML(tv) {
    let html;
    try {
      const doc = new DOMParser().parseFromString(SWT.PRISTINE, 'text/html');
      doc.querySelectorAll('script').forEach(s => { if (!s.hasAttribute('data-swt') && s.id !== 'seed-data' && s.id !== 'seed-orig') s.remove(); });
      doc.querySelectorAll('meta[http-equiv], base').forEach(x => x.remove());
      const sd = doc.getElementById('seed-data'); if (!sd) throw new Error('seed slot missing');
      sd.textContent = JSON.stringify(payload({ tv: !!tv })).replace(/</g, '\\u003c');
      if (!doc.querySelector('meta[charset]')) doc.head.insertAdjacentHTML('afterbegin', '<meta charset="utf-8">');
      html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    } catch (e) { toast('Could not build the file: ' + e.message); return; }
    SWT.saveFile(tv ? `SWT_Crew_TV_${stamp()}.html` : `SWT_Crew_Board_${stamp()}.html`, new Blob([html], { type: 'text/html' }))
      .then(ok => ok && toast(tv ? 'TV file saved. Open it on the TV computer, it starts in TV mode.' : 'Offline copy saved with all data.'));
  }
  function backup() { SWT.saveFile(`SWT_Crew_Backup_${stamp()}.json`, new Blob([JSON.stringify(payload())], { type: 'application/json' })).then(ok => ok && toast('Backup saved.')); }
  async function restore() {
    if (!canAdmin()) { toast('Only editors of this board restore backups.'); return; }
    const [file] = await pickFiles('.json,application/json'); if (!file) return;
    try {
      const o = JSON.parse(await SWT.u.readAs(file, 'text'));
      if (!o.db || !o.db.people) throw new Error('not a backup');
      if (!await confirmBox(`Restore the backup from ${o.savedAt ? new Date(o.savedAt).toLocaleString() : 'this file'}? It replaces the current board (${plural(o.db.people.length, 'person', 'people')}, ${plural(o.db.jobs.length, 'job')}).`, 'Restore', true)) return;
      applySnapshot(o);
      toast('Backup restored.');
    } catch (e) { toast('That file is not a crew board backup.'); }
  }
  function applySnapshot(o) {
    if (sharedMode()) {
      const nd = SWT.normalizeDB(SWT.u.clone(o.db));
      act('Restore backup', () => { SWT.DB.people = nd.people; SWT.DB.jobs = nd.jobs; SWT.DB.meta.source = nd.meta.source || null; return { msg: `Board restored from a backup: ${nd.people.length} crew, ${nd.jobs.length} jobs.`, always: true, metaChange: true }; }, { kind: 'import' });
      SWT.DB.settings = nd.settings; SWT.persist();
      Object.entries(o.photos || {}).forEach(([k, v]) => { if (SWT.DB.people.some(p => p.id === k)) SWT.store.setPhoto(k, v); });
      return;
    }
    SWT.DB = SWT.normalizeDB(o.db); SWT.seedHist(SWT.DB); SWT.reindex();
    SWT.store.photos.clear(); Object.entries(o.photos || {}).forEach(([k, v]) => SWT.store.setPhoto(k, v));
    SWT.UNDO.length = 0; SWT.addLog('Board restored from a saved copy.', { kind: 'import', by: 'system' }); SWT.persist(true);
    UI.refresh(); SWT.tv && SWT.tv.refresh();
  }
  SWT.applySnapshot = applySnapshot;

      else if (firstIdx(x) < ri && firstIdx(y) > ri) { inP = x; outP = y; }
      else { outP = x; inP = y; }
      if (!SWT.assignment(outP) && SWT.assignment(inP)) { const t = outP; outP = inP; inP = t; }
      if (!SWT.assignment(outP)) return R(`<p>Neither ${esc(outP.name)} nor ${esc(inP.name)} is on a job slot, so there is nothing to replace. Say "assign ${esc(inP.name)} to ..." instead.</p>`);
      const offMode = has('off');
      const r = run(`Replace ${outP.name} with ${inP.name}`, () => OPS.replace(outP, inP, { outStatus: offMode ? 'OFF' : 'BASE', start: dt.start || dt.date, end: dt.end, days: dt.days }), 'assign');
      AG.ctx.last = [outP.id, inP.id];
      return R(`<p class="ok">${ic('check')}${esc(r.msg)}</p>`, { acts: [{ label: 'Undo', act: 'undo' }] });
    }

    // ----- field updates
    const phoneM = /(\+?\d[\d\s\-]{6,}\d)/.exec(raw);
    if (has('phone') && phoneM && ppl.length === 1) { const p = ppl[0], v = phoneM[1].replace(/\s+/g, ' ').trim(); const r = run('Phone for ' + p.name, () => OPS.updatePerson(p, { phone: v }), 'person'); return R(`<p class="ok">${ic('check')}${esc(r.msg)} ${esc(v)}</p>`, { acts: [{ label: 'Undo', act: 'undo' }] }); }
    if (has('setNat') && nat && ppl.length === 1) { const p = ppl[0]; const r = run('Nationality for ' + p.name, () => OPS.updatePerson(p, { nat }), 'person'); return R(`<p class="ok">${ic('check')}${esc(p.name)} nationality set to ${esc(nat)}.</p>`, { acts: [{ label: 'Undo', act: 'undo' }] }); }
    if (has('setH') && rp.r.unknownH.length && ppl.length === 1) { const p = ppl[0], h = rp.r.unknownH[0]; run('H number for ' + p.name, () => OPS.updatePerson(p, { h }), 'person'); return R(`<p class="ok">${ic('check')}${esc(p.name)} H number set to ${esc(h)}.</p>`, { acts: [{ label: 'Undo', act: 'undo' }] }); }
    if (has('note') && ppl.length === 1) { const p = ppl[0]; const m = /\b(?:note|remark|comment)s?\s*[:\-]?\s*(.+)$/i.exec(raw); if (m) { const v = (p.note ? p.note + '\n' : '') + m[1].trim(); run('Note for ' + p.name, () => OPS.updatePerson(p, { note: v }), 'person'); return R(`<p class="ok">${ic('check')}Note added for ${esc(p.name)}.</p>`, { acts: [{ label: 'Undo', act: 'undo' }] }); } }
    if (pos && ppl.length === 1 && has('setPos') && !jr.job) { const p = ppl[0]; run('Position for ' + p.name, () => OPS.updatePerson(p, { pos }), 'person'); return R(`<p class="ok">${ic('check')}${esc(p.name)} is now ${esc(pos)}.</p>`, { acts: [{ label: 'Undo', act: 'undo' }] }); }
    if (has('remove') && !jr.job) {
      const p = ppl[0];
      return confirmPending(`Remove <b>${esc(p.name)}</b> (${esc(p.h || '-')}) from the crew list?`, () => { const r = run('Remove ' + p.name, () => OPS.deletePerson(p), 'person'); return R(`<p class="ok">${ic('check')}${esc(r.msg)}</p>`, { acts: [{ label: 'Undo', act: 'undo' }] }); });
    }

    // ----- status changes
    const backFirst = RX.backFrom.test(T) || (has('back') && !/\bdays off\b/.test(T)) || (has('back') && has('assign') && jr.job);
    if (has('sick')) return statusChange(ppl, 'SICK', dt, ctxNote);
    if (has('training') && !jr.job) return statusChange(ppl, 'TRAINING', dt, ctxNote);
    if (has('travel') && !jr.job) return statusChange(ppl, 'TRAVEL', dt, ctxNote);
    if (has('office') && !jr.job) return statusChange(ppl, 'SUPPORT', dt, ctxNote);
    if (has('off') && !backFirst) return daysOff(ppl, dt, ctxNote);
    if (has('back') || (has('assign') && jr.job) || jr.job || jr.same) {
      let job = jr.job || null;
      if (jr.same) job = ppl[0].lastJob ? SWT.job(ppl[0].lastJob) : null;
      if (jr.ambiguous && !job) return R('<p>Which job?</p>', { chips: jr.ambiguous.map(j => ({ label: `${SWT.jobTitle(j)}, ${j.unit}`, cmd: raw + ' job:' + j.id })) });
      if (job) return assign(ppl, job, shift, pos, dt, ctxNote, has('back'));
      if (has('base') && !has('back')) return toBase(ppl, ctxNote);
      return back(ppl, dt, ctxNote);
    }
    if (jr.ambiguous) return R('<p>Which job?</p>', { chips: jr.ambiguous.map(j => ({ label: `${SWT.jobTitle(j)}, ${j.unit}`, cmd: raw + ' job:' + j.id })) });
    if (has('base')) return toBase(ppl, ctxNote);
    if (has('assign')) return R(`<p>Where should ${ppl.map(p => esc(p.name)).join(' and ')} go? Name the rig, well or job number.</p>`, { chips: SWT.DB.jobs.filter(j => j.status !== 'Closed' && j.slots.some(s => !s.pid)).slice(0, 6).map(j => ({ label: `${SWT.jobTitle(j)} (${j.slots.filter(s => !s.pid).length} open)`, cmd: `assign ${ppl.map(pRef).join(' and ')} to job:${j.id}` })) });
    // only a person mentioned: show info
    return R(ppl.map(p => `<p>${where(p)}</p>`).join(''), { chips: ppl.length === 1 ? quickFor(ppl[0]) : [], acts: ppl.length === 1 ? [{ label: 'Open profile', act: 'person', pid: ppl[0].id }] : [] });
  }

  function quickFor(p) {
    const r = pRef(p);
    return SWT.duty(p.status) ? [{ label: 'Days off from today', cmd: `${r} days off` }, ...(p.status !== 'BASE' ? [{ label: 'Move to base', cmd: `move ${r} to base` }] : []), { label: 'Sick', cmd: `${r} sick` }] : [{ label: 'Back today', cmd: `${r} back today` }];
  }

  function daysOff(ppl, dt, note) {
    const start = dt.start || dt.date || null;
    const explicit = !!(start || dt.end || dt.days);
    const already = ppl.filter(p => !SWT.duty(p.status));
    if (already.length && !explicit) {
      const rest = ppl.filter(p => SWT.duty(p.status));
      const info = already.map(p => `${esc(p.name)} is already ${p.status === 'SICK' ? 'on sick leave' : 'on days off'}${p.dateIn ? ', back ' + D.fmt(p.dateIn, { wd: 1, autoY: 1 }) : ''}.`).join(' ');
      if (!rest.length) return R(`<p>${info} To change the dates say for example "${esc(already[0].name.split(' ')[0])} back on 20 nov" or "${esc(already[0].name.split(' ')[0])} days off from 2 nov for 21 days".</p>`, { chips: already.length === 1 ? [{ label: 'Back today', cmd: `${pRef(already[0])} back today` }] : [] });
      ppl = rest; note = `<p class="muted">${info}</p>` + note;
    }
    const r = run(ppl.length === 1 ? 'Days off: ' + ppl[0].name : `Days off: ${ppl.length} people`, () => {
      const rs = ppl.map(p => ({ p, r: OPS.daysOff(p, { start, end: dt.end, days: dt.days }) }));
      return { pids: ppl.map(p => p.id), msg: rs.map(x => x.r.msg).join(' '), vacs: rs.map(x => x.r.vac).filter(Boolean), planned: rs.some(x => x.r.planned) };
    }, 'off');
    const chips = (r.vacs || []).length === 1 ? suggestReplacements(r.vacs[0], ppl.map(p => p.id)) : [];
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)}</span></p>${note}${chips.length ? '<p class="muted" style="margin-top:6px">Fill the open slot with someone at base:</p>' : ''}`, { chips, acts: [{ label: 'Undo', act: 'undo' }, ...(ppl.length === 1 ? [{ label: 'Open profile', act: 'person', pid: ppl[0].id }] : [])] });
  }
  function back(ppl, dt, note) {
    const date = dt.date || dt.end || dt.start || null;
    const onDuty = ppl.filter(p => SWT.duty(p.status) && p.status !== 'TRAINING' && p.status !== 'TRAVEL');
    if (onDuty.length) {
      const info = onDuty.map(p => `${esc(p.name)} is already on duty (${esc(SWT.locationText(p))}).`).join(' ');
      ppl = ppl.filter(p => !onDuty.includes(p));
      if (!ppl.length) return R(`<p>${info}</p>`, { chips: onDuty.length === 1 ? quickFor(onDuty[0]) : [] });
      note = `<p class="muted">${info}</p>` + note;
    }
    const r = run(ppl.length === 1 ? 'Back: ' + ppl[0].name : `Back: ${ppl.length} people`, () => ({ pids: ppl.map(p => p.id), msg: ppl.map(p => OPS.back(p, { date })).map(x => x.msg).join(' ') }), 'back');
    const one = ppl.length === 1 ? ppl[0] : null;
    const chips = [];
    if (one && one.status === 'BASE') {
      const lj = one.lastJob && SWT.job(one.lastJob);
      if (lj && lj.status !== 'Closed') chips.push({ label: `Back to ${SWT.jobTitle(lj)}`, cmd: `assign ${pRef(one)} to job:${lj.id}` });
      SWT.vacancies().filter(v => SWT.compatible(v.slot.pos, one.pos)).slice(0, 3).forEach(v => chips.push({ label: `Fill ${SWT.jobTitle(v.job)} ${shiftWord(v.slot.shift)} ${SWT.abbr(v.slot.pos)}`, cmd: `assign ${pRef(one)} to job:${v.job.id} ${shiftWord(v.slot.shift)} as ${SWT.abbr(v.slot.pos)}` }));
    }
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)}</span></p>${note}`, { chips, acts: [{ label: 'Undo', act: 'undo' }] });
  }
  function assign(ppl, job, shift, pos, dt, note) {
    const r = run(ppl.length === 1 ? `Assign ${ppl[0].name} to ${SWT.jobTitle(job)}` : `Assign ${ppl.length} people to ${SWT.jobTitle(job)}`, () => ({ pids: ppl.map(p => p.id), jid: job.id, msg: ppl.map(p => OPS.assign(p, job, { shift, pos })).map(x => x.msg).join(' ') }), 'assign');
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)}</span></p>${note}`, { acts: [{ label: 'Undo', act: 'undo' }, { label: 'Show job', act: 'job-open', jid: job.id }] });
  }
  function toBase(ppl, note) {
    const r = run(ppl.length === 1 ? 'To base: ' + ppl[0].name : `To base: ${ppl.length} people`, () => {
      const rs = ppl.map(p => OPS.toBase(p)); return { pids: ppl.map(p => p.id), msg: rs.map(x => x.msg).join(' '), vacs: rs.map(x => x.vac).filter(Boolean) };
    }, 'base');
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)}</span></p>${note}`, { chips: (r.vacs || []).length === 1 ? suggestReplacements(r.vacs[0], ppl.map(p => p.id)) : [], acts: [{ label: 'Undo', act: 'undo' }] });
  }
  function statusChange(ppl, st, dt, note) {
    const r = run(`${SWT.STATUS[st].label}: ${ppl.map(p => p.name).join(', ')}`, () => {
      const rs = ppl.map(p => OPS.status(p, st, { start: dt.start || dt.date || null, end: dt.end || (dt.days ? D.add(dt.start || dt.date || D.today(), dt.days) : null) }));
      return { pids: ppl.map(p => p.id), msg: rs.map(x => x.msg).join(' '), vacs: rs.map(x => x.vac).filter(Boolean) };
    }, 'status');
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)}</span></p>${note}`, { chips: (r.vacs || []).length === 1 ? suggestReplacements(r.vacs[0], ppl.map(p => p.id)) : [], acts: [{ label: 'Undo', act: 'undo' }] });
  }

  function addPerson(raw, T, fp, pos, nat, dt) {
    const h = fp.unknownH[0] || null;
    const dir = h ? (SWT.DB.directory || []).find(r => r[0] === h) : null;
    let name = dir ? dir[1] : null;
    if (!name) {
      const m = /\b(?:add|register|create|new)\s+(?:a\s+)?(?:new\s+)?(?:person|employee|guy|crew member|crew|member)?\s*(?:named|called)?\s*([a-z][a-z\-' ]{2,40}?)(?=\s+(?:h[a-z]?\d|as\b|position|saudi|egyptian|pakistani|indian|nigerian|algerian|filipino|operator|supervisor|das|snr|senior|asst|assistant|opt|wsc|phone|$))/i.exec(raw + ' ');
      if (m) name = m[1].trim().replace(/\b\w/g, c => c.toUpperCase());
    }
    if (!name) return R('<p>Give me the H number (I look it up in the HR list) or the full name, for example "add H333022" or "add Ali Hassan H123456 operator Saudi".</p>');
    if (h && SWT.DB.people.some(p => p.h === h)) return R(`<p>${esc(h)} is already on the crew list.</p>`);
    const rec = { name, h, pos: pos || (dir ? SWT.posFromJobTitle(dir[3]) : 'Operator'), nat: nat || (dir && dir[2] ? dir[2] : null), status: 'BASE' };
    if (dir && dir[3]) rec.hr = { job: dir[3] };
    const r = run('Add ' + name, () => OPS.addPerson(rec), 'person');
    AG.ctx.last = [r.person.id];
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)} ${esc(rec.pos)}, ${esc(rec.nat || 'nationality not set')}, at base.</span></p>`, { acts: [{ label: 'Undo', act: 'undo' }, { label: 'Open profile', act: 'person', pid: r.person.id }], chips: [{ label: 'Assign to a job', cmd: `assign ${pRef(r.person)}` }] });
  }
  function newJob(raw, T, dt) {
    const rec = { unit: null, client: null, well: null, rig: null, mob: dt.date || dt.start || D.today() };
    const u = [[/flow ?back/, 'Flow Back'], [/ct milling|ur-?ct/, 'UR-CT Milling'], [/snubbing/, 'Snubbing Ops- Milling'], [/cooling/, 'UR-Cooling'], [/descal|de-scal/, 'De-Scalling'], [/pre-?frac/, 'UR Pre-Frac'], [/clean ?up/, 'Clean Up'], [/well test/, 'Well Test'], [/milling/, 'Milling']].find(([re]) => re.test(T)); if (u) rec.unit = u[1];
    const c = /\b(aramco|nesr|slb|bapco|halliburton|sinopec|adc)\b/.exec(T); if (c) rec.client = { aramco: 'Aramco', nesr: 'NESR', slb: 'SLB', bapco: 'BAPCO' }[c[1]] || c[1].toUpperCase();
    const rg = /\b(site|hwu|cts|rab|rig)\s*-?\s*(\d{1,4})\b/i.exec(raw); if (rg) rec.rig = rg[1].toUpperCase() + '-' + rg[2];
    const wl = /\b([a-z]{4})\s*-\s*?(\d{3,6}(?:-\d{1,3})?)\b/i.exec(raw.replace(/\b(site|hwu|cts|rab)\s*-?\s*\d+/ig, '')); if (wl) rec.well = wl[1].toUpperCase() + '-' + wl[2];
    if (!rec.rig && !rec.well) return R('<p>Tell me at least the rig or well, for example "new job flow back NESR HMYM-1234 SITE-555". Or use the form.</p>', { acts: [{ label: 'Open new job form', act: 'job-new' }] });
    rec.unit = rec.unit || 'Flow Back';
    const tpl = /flow/i.test(rec.unit) ? [['D', 'Snr. Operator'], ['N', 'Snr. Operator']] : [['D', 'Supervisor'], ['D', 'DAS'], ['D', 'Snr. Operator'], ['D', 'Operator'], ['N', 'Supervisor'], ['N', 'DAS'], ['N', 'Snr. Operator'], ['N', 'Operator']];
    rec.slots = tpl.map(([shift, pos]) => ({ shift, pos }));
    const r = run('New job ' + (rec.rig || rec.well), () => OPS.addJob(rec), 'job');
    AG.ctx.lastJob = r.job.id;
    return R(`<p class="ok">${ic('check')}<span>${esc(r.msg)} MOB ${D.fmt(rec.mob, { wd: 1 })}.</span></p>`, { acts: [{ label: 'Undo', act: 'undo' }, { label: 'Show job', act: 'job-open', jid: r.job.id }, { label: 'Edit details', act: 'job-edit', jid: r.job.id }] });
  }

  /* ===== questions ===== */
  function jobInfo(j) {
    const crew = j.slots.map(s => ({ s, p: s.pid ? SWT.person(s.pid) : null }));
    const line = sh => crew.filter(x => x.s.shift === sh).map(x => x.p ? `${esc(SWT.abbr(x.s.pos))} ${esc(x.p.name)}` : `<span style="color:var(--crit-ink)">${esc(SWT.abbr(x.s.pos))} open</span>`).join(', ') || 'none';
    return R(`<p><b>${esc(SWT.jobTitle(j))}</b>${j.rig && j.well ? ' / ' + esc(j.well) : ''}: ${esc(SWT.jobSub(j))}${j.mob ? `, MOB ${D.fmt(j.mob, { autoY: 1 })} (day ${D.diff(D.today(), j.mob) + 1})` : ''}.</p><p>${ic('sun', 'sm')} Day: ${line('D')}</p><p>${ic('moon', 'sm')} Night: ${line('N')}</p>`, { acts: [{ label: 'Show job', act: 'job-open', jid: j.id }] });
  }
  function vacancies(jr) {
    let v = SWT.vacancies(); if (jr.job) v = v.filter(x => x.job === jr.job);
    if (!v.length) return R('<p class="ok">' + ic('check') + 'No open slots. Every job is fully crewed.</p>');
    return R(`<p><b>${v.length} open slot${v.length === 1 ? '' : 's'}</b>:</p><p>${v.map(x => `${esc(SWT.jobTitle(x.job))} ${shiftWord(x.slot.shift)} ${esc(SWT.abbr(x.slot.pos))}`).join('<br>')}</p>`, { chips: v.slice(0, 4).map(x => { const s = SWT.suggestFor(x.slot.pos, { limit: 1 })[0]; return s ? { label: `${s.name} to ${SWT.jobTitle(x.job)} ${shiftWord(x.slot.shift)}`, cmd: `assign ${pRef(s)} to job:${x.job.id} ${shiftWord(x.slot.shift)} as ${SWT.abbr(x.slot.pos)}` } : null; }).filter(Boolean) });
  }
  function summary() {
    const c = SWT.counts(), t = D.today();
    const inT = SWT.DB.people.filter(p => !SWT.duty(p.status) && p.dateIn === t), outT = SWT.DB.people.filter(p => SWT.duty(p.status) && p.dateOut === t);
    return R(`<p><b>${D.fmt(t, { wd: 1, y: 1 })}</b>: ${c.total} crew. ${c.JOB} on jobs (${c.day} day, ${c.night} night), ${c.BASE} at base, ${c.SUPPORT} in office, ${c.OFF} on days off${c.SICK ? ', ' + c.SICK + ' sick' : ''}.</p><p>Back today: ${inT.length ? inT.map(p => esc(p.name)).join(', ') : 'nobody'}. Days off today: ${outT.length ? outT.map(p => esc(p.name)).join(', ') : 'nobody'}. Back in the next 7 days: ${c.back7}. Open slots: ${c.vacant}.</p>${c.overIn + c.overOut ? `<p>${ic('alert', 'sm')} ${c.overIn} return dates and ${c.overOut} days-off dates have passed and need updating.</p>` : ''}`, { chips: [{ label: 'Who is back this week?', cmd: 'who is back this week' }, { label: 'Open slots', cmd: 'open slots' }, ...(c.overIn ? [{ label: 'Who is overdue?', cmd: 'who is overdue' }] : [])] });
  }
  function query(T, text, dt, jr, pos, nat, shift, soft) {
    const t = D.today();
    let list = SWT.DB.people.slice(); const crit = [];
    if (jr.job) { list = list.filter(p => { const a = SWT.assignment(p); return a && a.job === jr.job; }); crit.push('on ' + SWT.jobTitle(jr.job)); }
    if (/\bdays off|\boff\b|\bon leave|\bat home|\bholiday|\bvacation/.test(T) && !/\bgoing|go on|going on|leaving|due/.test(T)) { list = list.filter(p => p.status === 'OFF'); crit.push('on days off'); }
    if (/\b(base|yard|available|free|standby|spare|ready)\b/.test(T)) { list = list.filter(p => p.status === 'BASE'); crit.push('at base'); }
    if (/\b(on job|on jobs|working|on site|on rig|in the field|field)\b/.test(T)) { list = list.filter(p => p.status === 'JOB'); crit.push('on jobs'); }
    if (/\bon duty\b/.test(T)) { list = list.filter(p => SWT.duty(p.status)); crit.push('on duty'); }
    if (/\bsick\b/.test(T)) { list = list.filter(p => p.status === 'SICK'); crit.push('sick'); }
    if (/\btraining\b/.test(T)) { list = list.filter(p => p.status === 'TRAINING'); crit.push('in training'); }
    if (/\boffice\b/.test(T)) { list = list.filter(p => p.status === 'SUPPORT'); crit.push('in the office'); }
    if (nat) { list = list.filter(p => p.nat === nat); crit.push(nat); }
    if (/\bexpats?\b/.test(T)) { list = list.filter(p => SWT.group(p) === 'X'); crit.push('expat'); }
    if (pos) { list = list.filter(p => p.pos === pos || (pos === 'Supervisor' && p.pos === 'Service Lead')); crit.push(pos); }
    if (shift && jr.job) { list = list.filter(p => SWT.assignment(p) && SWT.assignment(p).slot.shift === shift); crit.push(shiftWord(shift) + ' shift'); }
    const overdue = RX.overdue.test(T);
    let win = null;
    if (/\bthis week\b|\bnext 7|\bnext seven|\bin 7 days|\bweek\b/.test(text)) win = 7;
    if (/\bnext 14|\btwo weeks|\b2 weeks|\bfortnight/.test(text)) win = 14;
    if (/\bthis month\b|\bnext 30|\bmonth\b/.test(text)) win = 30;
    const one = dt.date || dt.start || dt.end;
    const retQ = /\b(back|return|returns|returning|coming|come back|resum|arriv)/.test(T);
    const outQ = /\b(going|go on|leaving|leave|out|due|rotat|days off)\b/.test(T) && !retQ;
    if (overdue) {
      const a = SWT.DB.people.filter(p => !SWT.duty(p.status) && p.dateIn && p.dateIn < t), b = SWT.DB.people.filter(p => SWT.duty(p.status) && p.dateOut && !p.daily && p.dateOut < t);
      const showB = !retQ;
      AG.ctx.list = a.concat(showB ? b : []).map(p => p.id);
      return R(`<p><b>${a.length}</b> should be back from days off (return date passed)${showB ? `, and <b>${b.length}</b> passed their days-off date` : ''}.</p>${a.length ? '<p class="muted">Return date passed:</p>' + peopleList(a.sort((x, y) => x.dateIn.localeCompare(y.dateIn)), { max: 25 }) : ''}${showB && b.length ? '<p class="muted" style="margin-top:8px">Days off overdue:</p>' + peopleList(b.sort((x, y) => x.dateOut.localeCompare(y.dateOut)), { max: 25 }) : ''}`, { chips: a.length ? [{ label: `Mark all ${a.length} back today`, cmd: 'mark all overdue back' }] : [] });
    }
    if (retQ && (win || one)) {
      const until = one ? one : D.add(t, win);
      const from = one ? one : t;

  }

  /* ----- database and presence, in the shape the sync engine already expects ----- */
  function dbNS() {
    const S = K(), D = LV.db;
    const api = {
      collection(c) {
        return {
          onSnapshot(next, onErr) {
            let prev = new Map();
            return S.onValue(S.ref(D, c), snap => {
              const val = snap.val() || {}, cur = new Map(), changes = [];
              for (const id of Object.keys(val)) {
                const d = val[id]; if (!d || typeof d !== 'object') continue;
                const j = JSON.stringify(d); cur.set(id, j);
                const p = prev.get(id);
                if (p === undefined) changes.push({ type: 'added', doc: mkDoc(id, d) }); else if (p !== j) changes.push({ type: 'modified', doc: mkDoc(id, d) });
              }
              for (const [id, j] of prev) if (!cur.has(id)) changes.push({ type: 'removed', doc: mkDoc(id, JSON.parse(j)) });
              prev = cur;
              const docs = [...cur.keys()].map(id => mkDoc(id, val[id]));
              next({ docs, size: docs.length, empty: !docs.length, docChanges: () => changes });
            }, e => onErr && onErr(mapErr(e)));
          },
          doc(id) { return api.doc(c + '/' + id); }
        };
      },
      doc(path) {
        const r = S.ref(D, path), id = path.split('/').pop();
        return {
          id, path,
          get: () => S.get(r).then(s => mkDoc(id, s.exists() ? s.val() : null), e => { throw mapErr(e); }),
          set: data => S.set(r, clean(data)).catch(e => { throw mapErr(e); }),
          update: data => S.update(r, flatten(clean(data), '')).catch(e => { throw mapErr(e); }),
          delete: () => S.remove(r).catch(e => { throw mapErr(e); })
        };
      }
    };
    return api;
  }
  function roomNS() {
    const S = K(), D = LV.db, conn = 'c' + Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
    const myRef = S.ref(D, 'presence/' + conn);
    let mine = {}, handlers = [], prev = new Map(), started = false;
    const write = () => S.set(myRef, { uid: LV.uid, name: LV.name, color: LV.color, presence: clean(mine), at: S.serverTimestamp() }).catch(() => { });
    S.onValue(S.ref(D, '.info/connected'), s => { if (s.val() === true) S.onDisconnect(myRef).remove().then(write).catch(() => { }); });
    addEventListener('pagehide', () => { S.remove(myRef).catch(() => { }); });
    function start() {
      if (started) return; started = true;
      S.onValue(S.ref(D, 'presence'), snap => {
        const v = snap.val() || {}, cur = new Map();
        for (const [k, p] of Object.entries(v)) if (p && p.uid) {
          if (p.name) { LV.names[p.uid] = { id: p.uid, name: p.name, color: p.color || colorFor(p.uid) }; }
          cur.set(k, { peer: k, by: p.uid, isMe: p.uid === LV.uid, sameTab: k === conn, kind: 'viewer', guest: false, presence: p.presence || {}, updatedAt: typeof p.at === 'number' ? p.at : Date.now() });
        }
        const joined = [...cur.keys()].filter(k => !prev.has(k)).map(k => cur.get(k)), left = [...prev.keys()].filter(k => !cur.has(k)).map(k => prev.get(k));
        prev = cur;
        const ch = { peers: [...cur.values()], joined, left };
        handlers.forEach(h => { try { h(ch); } catch (e) { console.error(e); } });
      }, () => { });
    }
    return {
      onPeers(h) { handlers.push(h); start(); return () => { handlers = handlers.filter(x => x !== h); }; },
      presence(patch) { for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; } return write(); },
      emit() { }, on() { return () => { }; }
    };
  }
  function userNS() {
    return {
      me: async () => ({ id: LV.uid, name: LV.name, email: '', avatarUrl: '', color: LV.color, canEdit: true, guest: false }),
      id: async () => LV.uid,
      can: async () => true,                 // everyone who is in can edit
      canEdit: async () => true,
      isOwner: async () => false,
      profiles: async ids => { const o = {}; [].concat(ids).forEach(id => { const n = LV.names[id]; o[id] = { id, name: (n && n.name) || (id === LV.uid ? LV.name : ''), avatarUrl: '', color: (n && n.color) || colorFor(id) }; }); return o; }
    };
  }

  /* ----- the open/close switch (a small file the coordinator controls from outside) ----- */
  async function readSwitch() {
    if (!LV.switchUrl) return true;
    try {
      const r = await fetch(LV.switchUrl + (LV.switchUrl.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return LV.open;                 // can't read it: keep the current state, don't lock people out on a blip
      const txt = (await r.text()).trim().toUpperCase();
      return !/^(STOP|OFF|CLOSED?|0)\b/.test(txt);
    } catch (e) { return LV.open; }
  }
  function closedGate() {
    let g = $('#gate');
    if (!g) { g = document.createElement('div'); g.id = 'gate'; g.className = 'gate'; document.body.appendChild(g); }
    g.innerHTML = `<div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-t"><div class="gate-brand">HALLIBURTON</div><div class="gate-body"><h1 id="gate-t">The board is closed</h1><p class="gate-sub">The crew board is closed right now. It will be back when the coordinator opens it again.</p></div><p class="gate-foot">KSA Surface Well Testing · Built by Hossam M</p></div>`;
    return g;
  }
  function applySwitch(open) {
    LV.open = open;
    if (!open) {
      if (LV.closedShown) return;
      LV.closedShown = true;
      SWT.readOnly = true;
      try { SWT.tv && SWT.tv.on && SWT.tv.stop(); } catch (e) { }
      document.querySelectorAll('.modal, .scrim, #drawer').forEach(x => x.remove());
      closedGate(); UI.refresh && UI.refresh();
    } else if (LV.closedShown) {
      LV.closedShown = false; location.reload();   // reopened: start fresh and reconnect cleanly
    }
  }
  function watchSwitch() {
    clearInterval(LV.timer);
    LV.timer = setInterval(async () => { applySwitch(await readSwitch()); }, LV.every);
    document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') applySwitch(await readSwitch()); });
  }

  /* ----- the name + password gate ----- */
  function gate(html) {
    let g = $('#gate');
    if (!g) { g = document.createElement('div'); g.id = 'gate'; g.className = 'gate'; document.body.appendChild(g); }
    g.innerHTML = `<div class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-t"><div class="gate-brand">HALLIBURTON</div><div class="gate-body">${html}</div><p class="gate-foot">KSA Surface Well Testing · Built by Hossam M</p></div>`;
    return g;
  }
  const NKEY = 'swtcrew.live.name';
  const lastName = () => { try { return localStorage.getItem(NKEY) || ''; } catch (e) { return ''; } };
  const rememberName = n => { try { localStorage.setItem(NKEY, n); } catch (e) { } };

  function signInView() {
    const S = K();
    const g = gate(`<h1 id="gate-t">SWT Crew Board</h1><p class="gate-sub">Type your name and the team password to open the board.</p>
      <form id="gate-f" novalidate>
        <label>Your name<input class="inp" id="g-name" autocomplete="name" maxlength="40" value="${esc(lastName())}" required></label>
        <label>Team password<input class="inp" id="g-pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
        <label class="chk" style="margin:0"><input type="checkbox" id="g-show"> Show password</label>
        <button class="btn pri" id="g-go" type="submit">Open the board</button>
        <p class="gate-msg" id="g-msg" role="alert"></p>
      </form>`);
    const msg = g.querySelector('#g-msg'), btn = g.querySelector('#g-go');
    (g.querySelector('#g-name').value ? g.querySelector('#g-pass') : g.querySelector('#g-name')).focus();
    g.querySelector('#g-show').onchange = e => { g.querySelector('#g-pass').type = e.target.checked ? 'text' : 'password'; };
    g.querySelector('#gate-f').onsubmit = async ev => {
      ev.preventDefault();
      const name = g.querySelector('#g-name').value.trim(), pass = g.querySelector('#g-pass').value;
      if (!name) { msg.textContent = 'Type your name.'; return; }
      if (!pass) { msg.textContent = 'Type the team password.'; return; }
      btn.disabled = true; msg.textContent = 'Opening...';
      if (!(await passOk(pass))) { btn.disabled = false; msg.textContent = 'The team password is not right. Ask Hossam M for it.'; return; }
      LV.name = name; rememberName(name);
      try {
        const c = await S.signInAnonymously(LV.auth);
        LV.uid = c.user.uid; LV.color = colorFor(LV.uid);
        LV.names[LV.uid] = { id: LV.uid, name, color: LV.color };
        try { await S.set(S.ref(LV.db, 'names/' + LV.uid), { name, color: LV.color, at: S.serverTimestamp() }); } catch (e) { }
        LV.dbNS = dbNS(); LV.roomNS = roomNS(); LV.userNS = userNS();
        hideGate(); LV.resolve(LV.provider);
      } catch (e) {
        btn.disabled = false;
        msg.textContent = codeOf(e).indexOf('network') >= 0 ? 'No connection. Check the internet and try again.'
          : codeOf(e).indexOf('operation-not-allowed') >= 0 ? 'The board is not set up for name sign-in yet. Tell Hossam M.'
            : 'Could not open the board. Try again in a moment.';
      }
    };
  }
  const hideGate = () => { const g = $('#gate'); if (g) g.remove(); };

  LV.provider = { kind: 'firebase', use: name => Promise.resolve(name === 'db' ? LV.dbNS : name === 'room' ? LV.roomNS : name === 'user' ? LV.userNS : null) };

  /* ----- start ----- */
  LV.start = function () {
    LV.cfg = config();
    LV.switchUrl = (LV.cfg && LV.cfg.switch) || '';
    return new Promise(async resolve => {
      LV.resolve = p => { if (LV.entered) return; LV.entered = true; watchSwitch(); resolve(p); };
      const S = K();
      if (!S) { gate('<h1 id="gate-t">Cannot start</h1><p class="gate-sub">This copy of the board is missing part of its code. Ask Hossam M for the current link.</p>'); return; }
      if (!LV.cfg) { gate('<h1 id="gate-t">Not set up yet</h1><p class="gate-sub">This board has no database settings yet. Ask Hossam M to finish the setup.</p>'); return; }
      try { LV.app = S.initializeApp(LV.cfg.firebase, 'swt-crew-live'); LV.auth = S.getAuth(LV.app); LV.db = S.getDatabase(LV.app, LV.cfg.firebase.databaseURL); }
      catch (e) { gate(`<h1 id="gate-t">Cannot connect</h1><p class="gate-sub">The database settings are not valid (${esc(e.message)}).</p>`); return; }
      gate('<h1 id="gate-t">SWT Crew Board</h1><p class="gate-sub">Checking...</p>');
      if (!(await readSwitch())) { LV.open = false; closedGate(); return; }
      signInView();
    });
  };

  /* this is the live-link build, so boot straight into the shared database */
  SWT.boot = async function () {
    SWT.PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    UI.applyTheme();
    await SWT.store.init();
    const provider = await LV.start();
    if (!provider) return;   // a gate is showing (closed, not set up, or cannot connect): nothing more to do
    return SWT.bootShared(provider, { failMsg: 'Could not reach the team database. Check the internet connection and reload the page.' });
  };
})(window.SWT = window.SWT || {});

SWT.boot().catch(function (e) { console.error(e); document.body.insertAdjacentHTML('afterbegin', '<p style="padding:20px;font:15px sans-serif;color:#b00">The crew board could not start: ' + String(e && e.message || e) + '</p>'); });
</script>
</body>
</html>
