/* ===== SWT Crew Board — styles ===== */
:root {
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-plate: "Barlow Condensed", "Avenir Next Condensed", "Bahnschrift SemiCondensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --brand: #CC0000; --brand-2: #A80000; --brand-ink: #fff;
  --steel: #1D232A; --steel-2: #2A323B; --steel-ink: #F2F4F6; --steel-ink-2: #A9B3BE;
  --bg: #E8EBEE; --surface: #FFFFFF; --surface-2: #F4F6F8; --surface-3: #EAEDF0;
  --line: #D6DBE0; --line-2: #BFC6CE; --ink: #12171D; --ink-2: #45505B; --ink-3: #6B7580;
  --focus: #2a78d6; --crit: #d03b3b; --crit-ink: #b42323; --warn: #fab219; --good: #0ca30c; --good-ink: #006300;
  --st-JOB: #2a78d6; --st-BASE: #eda100; --st-SUPPORT: #6250d6; --st-TRAINING: #eb6834; --st-TRAVEL: #008300; --st-OFF: #1baf7a; --st-SICK: #e87ba4;
  --hatch: repeating-linear-gradient(135deg, transparent 0 6px, rgba(208,59,59,.10) 6px 12px);
  --shadow-1: 0 1px 2px rgba(18,23,29,.07), 0 0 0 1px rgba(18,23,29,.05);
  --shadow-2: 0 8px 28px rgba(18,23,29,.18), 0 0 0 1px rgba(18,23,29,.06);
  --r-plate: 6px; --r-panel: 10px; --r-btn: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151A; --surface: #191F26; --surface-2: #1F262E; --surface-3: #27303A;
    --line: #2C3540; --line-2: #3A4552; --ink: #EDF0F3; --ink-2: #B3BCC6; --ink-3: #8993A0;
    --steel: #0C1014; --steel-2: #1A2027; --brand: #DD1C1C; --brand-2: #B81414;
    --st-JOB: #3987e5; --st-BASE: #c98500; --st-SUPPORT: #9085e9; --st-TRAINING: #d95926; --st-TRAVEL: #1f9a3f; --st-OFF: #199e70; --st-SICK: #d55181;
    --hatch: repeating-linear-gradient(135deg, transparent 0 6px, rgba(230,103,103,.13) 6px 12px);
    --crit-ink: #ff8a8a; --good-ink: #3fd16a;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.04);
    --shadow-2: 0 10px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151A; --surface: #191F26; --surface-2: #1F262E; --surface-3: #27303A;
  --line: #2C3540; --line-2: #3A4552; --ink: #EDF0F3; --ink-2: #B3BCC6; --ink-3: #8993A0;
  --steel: #0C1014; --steel-2: #1A2027; --brand: #DD1C1C; --brand-2: #B81414;
  --st-JOB: #3987e5; --st-BASE: #c98500; --st-SUPPORT: #9085e9; --st-TRAINING: #d95926; --st-TRAVEL: #1f9a3f; --st-OFF: #199e70; --st-SICK: #d55181;
  --hatch: repeating-linear-gradient(135deg, transparent 0 6px, rgba(230,103,103,.13) 6px 12px);
  --crit-ink: #ff8a8a; --good-ink: #3fd16a;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.04);
  --shadow-2: 0 10px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
html, body { margin: 0; }
body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; } .ic.lg { width: 22px; height: 22px; }
.flag { width: 21px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.14); flex: none; display: inline-block; vertical-align: middle; overflow: hidden; }
.flag-fb { font: 700 9px/14px var(--f-plate); text-align: center; background: var(--surface-3); color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.plate-font { font-family: var(--f-plate); }

/* ===== shell ===== */
.app { display: grid; height: 100%; grid-template-columns: 84px minmax(0, 1fr) auto; grid-template-rows: 56px minmax(0, 1fr); grid-template-areas: "top top top" "rail main agent"; }
.topbar { grid-area: top; background: var(--steel); color: var(--steel-ink); display: flex; align-items: center; gap: 14px; padding: 0 14px 0 0; position: relative; z-index: 5; }
.brand { height: 100%; display: flex; align-items: center; background: var(--brand); color: var(--brand-ink); padding: 0 18px; font: 700 21px/1 var(--f-plate); letter-spacing: .07em; text-decoration: none; min-width: 84px; justify-content: center; }
.brand img { max-height: 30px; max-width: 170px; display: block; }
.brand.has-logo { background: #fff; }
.apptitle { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.apptitle b { font: 700 19px/1 var(--f-plate); letter-spacing: .02em; white-space: nowrap; }
.apptitle span { font-size: 12px; color: var(--steel-ink-2); white-space: nowrap; }
.tsearch { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
.tsearch input { width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--steel-2); background: var(--steel-2); color: var(--steel-ink); padding: 0 12px 0 36px; }
.tsearch input::placeholder { color: var(--steel-ink-2); }
.tsearch .ic { position: absolute; left: 10px; top: 9px; color: var(--steel-ink-2); }
.tsearch-res { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); color: var(--ink); border-radius: var(--r-panel); box-shadow: var(--shadow-2); max-height: 60vh; overflow: auto; padding: 6px; display: none; }
.tsearch-res.open { display: block; }
.tclock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; }
.tclock b { font: 700 21px/1 var(--f-plate); letter-spacing: .03em; }
.tclock span { font-size: 11px; color: var(--steel-ink-2); }
.tbtn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--steel-2); background: transparent; color: var(--steel-ink); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.tbtn:hover { background: var(--steel-2); }
.tbtn.on { background: var(--steel-2); border-color: #4a5664; }
.builtby { font-size: 11px; color: var(--steel-ink-2); white-space: nowrap; }

.rail { grid-area: rail; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 8px 6px; gap: 2px; overflow-y: auto; }
.rail button { border: 0; background: transparent; border-radius: 8px; padding: 9px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-2); font-size: 11.5px; position: relative; }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail button.on { background: var(--surface-3); color: var(--ink); font-weight: 600; }
.rail button.on::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
.rail .badge { position: absolute; top: 4px; right: 12px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--crit); color: #fff; font: 700 10.5px/17px var(--f-ui); padding: 0 4px; }
.rail .sp { flex: 1; }
.main { grid-area: main; overflow: auto; position: relative; }
.view { padding: 20px 24px 60px; max-width: 1680px; margin: 0 auto; }
.vhead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.vhead h1 { font: 700 30px/1 var(--f-plate); margin: 0; letter-spacing: .01em; }
.vhead p { margin: 4px 0 0; color: var(--ink-3); }
.vhead .grow { flex: 1; }

/* ===== controls ===== */
.btn { height: 34px; padding: 0 12px; border-radius: var(--r-btn); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-2); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--crit-ink); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.xs { height: 24px; padding: 0 7px; font-size: 12px; border-radius: 6px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.icon { padding: 0; width: 34px; justify-content: center; }
.btn.icon.sm { width: 28px; }
.inp, .sel, textarea.inp { height: 34px; border-radius: var(--r-btn); border: 1px solid var(--line-2); background: var(--surface); padding: 0 10px; min-width: 0; }
textarea.inp { height: auto; padding: 8px 10px; resize: vertical; }
.sel { padding-right: 26px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 14px) 15px, calc(100% - 9px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
.inp:focus, .sel:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-btn); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--surface-3); color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 30px; border-radius: 15px; border: 1px solid var(--line-2); background: var(--surface); padding: 0 11px 0 9px; display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--ink-3); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12px; }
.chip.on .n { color: inherit; opacity: .75; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filters .inp.q { width: 230px; }
.kbd { font: 600 11px/1 var(--f-ui); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink-3); }

/* status pill */
.st { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 7px; border-radius: 12px; font-size: 12.5px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--c) 15%, var(--surface)); white-space: nowrap; }
.st .ic { width: 14px; height: 14px; color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
.st-JOB { --c: var(--st-JOB); } .st-BASE { --c: var(--st-BASE); } .st-SUPPORT { --c: var(--st-SUPPORT); } .st-TRAINING { --c: var(--st-TRAINING); }
.st-TRAVEL { --c: var(--st-TRAVEL); } .st-OFF { --c: var(--st-OFF); } .st-SICK { --c: var(--st-SICK); }
.hno { font: 600 13px/1 var(--f-plate); letter-spacing: .06em; color: var(--ink-2); background: var(--surface-3); border-radius: 4px; padding: 3px 5px 2px; white-space: nowrap; }
.hno.none { color: var(--ink-3); font-style: italic; letter-spacing: 0; }
.pos { font: 600 13px/1 var(--f-plate); letter-spacing: .03em; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px 2px; white-space: nowrap; }
.cd { font-size: 12px; color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.cd.over { color: var(--crit-ink); font-weight: 600; }
.cd.soon { color: var(--ink); font-weight: 600; }

/* ===== avatar & plate (magnetic name tag) ===== */
.av { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 15px/1 var(--f-plate); letter-spacing: .03em; color: var(--ink-2); background: var(--surface-3); overflow: hidden; position: relative; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.lg { width: 112px; height: 112px; font-size: 40px; }
.av.md { width: 52px; height: 52px; font-size: 19px; }
.av.sm { width: 28px; height: 28px; font-size: 12px; }
.av.xs { width: 22px; height: 22px; font-size: 10px; }
.av.t1 { background: #DCE3EA; color: #3B4652; } .av.t2 { background: #E4E0D8; color: #514839; } .av.t3 { background: #DCE6E1; color: #36493F; } .av.t4 { background: #E6DCE0; color: #523B45; } .av.t5 { background: #DDDCE8; color: #3E3B57; } .av.t6 { background: #E7E3D1; color: #4E4729; }
:root[data-theme="dark"] .av.t1, :root[data-theme="dark"] .av.t2, :root[data-theme="dark"] .av.t3, :root[data-theme="dark"] .av.t4, :root[data-theme="dark"] .av.t5, :root[data-theme="dark"] .av.t6 { background: #2A333D; color: #C9D1DA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .av[class*=" t"] { background: #2A333D; color: #C9D1DA; } }

.plate { --c: var(--ink-3); position: relative; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: var(--r-plate); box-shadow: var(--shadow-1); padding: 7px 10px 7px 13px; min-width: 0; cursor: pointer; text-align: left; border: 0; width: 100%; color: var(--ink); }
.plate::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: var(--r-plate) 0 0 var(--r-plate); background: var(--c); }
.plate:hover { box-shadow: 0 0 0 1px var(--line-2), 0 3px 10px rgba(18,23,29,.1); }
.plate .pt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.plate .nm { font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate .mt { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.plate .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.plate.mini { padding: 5px 8px 5px 11px; gap: 8px; }
.plate.mini .nm { font-size: 13px; }
.plate[draggable="true"] { cursor: grab; }
.plate.slotp { padding: 5px 8px 5px 10px; gap: 7px; }
.plate.slotp .nm { font-size: 13px; }
.plate.slotp .mt { gap: 5px; }
.plate.slotp .hno { font-size: 12px; padding: 2px 4px 1px; }
.flag.sm { width: 17px; height: 11px; }
.plate.dragging { opacity: .45; }
.plate.sel { box-shadow: 0 0 0 2px var(--focus); }

/* ===== cards & panels ===== */
.panel { background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-1); padding: 16px; min-width: 0; }
.panel h2 { font: 700 19px/1.1 var(--f-plate); margin: 0 0 12px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.panel h2 .grow { flex: 1; }
.panel h2 small { font: 400 13px var(--f-ui); color: var(--ink-3); }
.panel h2 .btn, .vhead .btn, .groupttl .btn { font: 500 13.5px var(--f-ui); letter-spacing: 0; }
.empty .btn { margin-left: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
.empty { color: var(--ink-3); padding: 18px 4px; text-align: center; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r-panel); overflow: hidden; box-shadow: var(--shadow-1); margin-bottom: 16px; }
.kpi { background: var(--surface); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 3px; border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.kpi:hover { background: var(--surface-2); }
.kpi .k { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.kpi .v { font: 700 40px/1 var(--f-plate); letter-spacing: .01em; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
.kpi.alert .v { color: var(--crit-ink); }
.splitbar { display: flex; gap: 2px; height: 28px; margin: 4px 0 8px; }
.splitbar > div { background: var(--c); border-radius: 4px; min-width: 3px; display: flex; align-items: center; padding-left: 8px; color: #fff; font: 700 14px/1 var(--f-plate); overflow: hidden; white-space: nowrap; }
.splitbar > div.dk { color: #12171D; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

/* bars (ranked) */
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 38px; align-items: center; gap: 10px; font-size: 13px; }
.bar .lb { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.bar .tr { height: 14px; background: var(--surface-3); border-radius: 0 4px 4px 0; position: relative; }
.bar .fl { position: absolute; left: 0; top: 0; bottom: 0; background: #2a78d6; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar .vl { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* rows list */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.click { cursor: pointer; border-radius: 6px; }
.row.click:hover { background: var(--surface-2); }
.meter { width: 90px; height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; flex: none; }
.meter i { display: block; height: 100%; background: var(--st-JOB); border-radius: 4px; }
.datebadge { width: 46px; flex: none; text-align: center; border-radius: 6px; background: var(--surface-3); padding: 4px 0 3px; line-height: 1; }
.datebadge b { display: block; font: 700 20px/1 var(--f-plate); }
.datebadge span { font-size: 10.5px; color: var(--ink-3); }
.issue { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); }
.issue:first-child { border-top: 0; }
.issue .ic.crit { color: var(--crit); } .issue .ic.warn { color: #b57d00; }
.groupttl { font: 700 16px/1 var(--f-plate); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.groupttl .n { font: 600 13px var(--f-ui); color: var(--ink-3); }

/* ===== crew grid ===== */
.crewgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.pcard { --c: var(--ink-3); background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-1); padding: 12px 12px 11px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; cursor: pointer; position: relative; border: 0; text-align: left; color: var(--ink); width: 100%; }
.pcard::after { content: ""; position: absolute; left: 12px; right: 12px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--c); }
.pcard:hover { box-shadow: 0 0 0 1px var(--line-2), 0 4px 14px rgba(18,23,29,.1); }
.pcard .av { grid-row: span 3; }
.pcard .nm { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pcard .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .l2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pcard .l3 { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.pcard .l3 > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 7px; padding-top: 8px; border-top: 1px solid var(--line); }
.pcard .foot .grow { flex: 1; min-width: 0; }
.prog { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--c); border-radius: 2px; }
.pcard .qa { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.pcard:hover .qa, .pcard:focus-within .qa { opacity: 1; }
.pcard.sel { box-shadow: 0 0 0 2px var(--focus); }
.pcard .tick { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line-2); background: var(--surface); display: none; place-items: center; color: #fff; }
.bulk .pcard .tick { display: grid; }
.pcard.sel .tick { background: var(--focus); border-color: var(--focus); }
.bulkbar { position: sticky; bottom: 14px; z-index: 4; margin: 16px auto 0; width: max-content; max-width: 100%; display: flex; align-items: center; gap: 8px; background: var(--steel); color: var(--steel-ink); padding: 8px 10px 8px 16px; border-radius: 12px; box-shadow: var(--shadow-2); flex-wrap: wrap; }
.bulkbar .btn { background: var(--steel-2); border-color: #3c4652; color: var(--steel-ink); }
table.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--r-panel); overflow: hidden; box-shadow: var(--shadow-1); font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-2); background: var(--surface-2); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; cursor: pointer; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:hover td { background: var(--surface-2); cursor: pointer; }
.tbl td.wrap { white-space: normal; }

/* ===== jobs board ===== */
.jobgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start; }
.job { background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-1); overflow: hidden; min-width: 0; }
.job.closed { opacity: .7; }
.jhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px 11px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.jno { grid-row: span 2; width: 44px; height: 44px; border-radius: 8px; background: var(--steel); color: var(--steel-ink); display: grid; place-items: center; font: 700 22px/1 var(--f-plate); }
.jno.x { background: var(--surface-3); color: var(--ink-3); font-size: 15px; }
.jttl { font: 700 22px/1.05 var(--f-plate); letter-spacing: .015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: baseline; gap: 8px; }
.jttl small { font: 600 14px var(--f-plate); color: var(--ink-3); letter-spacing: .04em; }
.jsub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jact { grid-row: span 2; display: flex; align-items: center; gap: 4px; }
.jmeta { display: flex; gap: 14px; padding: 8px 14px; font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.jmeta b { font-weight: 600; color: var(--ink); }
.shifts { display: grid; grid-template-columns: 1fr 1fr; }
.shift { padding: 10px 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.shift + .shift { border-left: 1px solid var(--line); }
.shift h4 { margin: 0 0 2px; font: 700 14px/1 var(--f-plate); letter-spacing: .05em; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.shift h4 .n { font: 500 12px var(--f-ui); color: var(--ink-3); letter-spacing: 0; margin-left: auto; }
.slot { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 6px; min-height: 40px; border-radius: var(--r-plate); position: relative; }
.slot .sp { font: 700 13px/1 var(--f-plate); letter-spacing: .03em; color: var(--ink-3); text-align: right; }
.slot.vac .open { height: 38px; border-radius: var(--r-plate); background: var(--hatch); border: 1px dashed color-mix(in srgb, var(--crit) 55%, transparent); display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--crit-ink); font-size: 12.5px; font-weight: 600; cursor: pointer; width: 100%; text-align: left; }
.slot.vac .open:hover { background: color-mix(in srgb, var(--crit) 10%, var(--surface)); }
.slot.drop { outline: 2px dashed var(--focus); outline-offset: 2px; }
.slot .sx { position: absolute; right: -4px; top: -6px; display: none; }
.slot:hover .sx { display: block; }
.jfoot { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.eqlist { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px 12px; }
.eq { font-size: 11.5px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); padding: 3px 6px; }
.tray { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); padding: 10px 0 12px; margin: -6px 0 10px; }
.tray .trow { display: flex; gap: 8px; overflow-x: auto; padding: 3px 2px 6px; }
.tray .trow .plate { width: 200px; flex: none; }
.tray h3 { margin: 0 0 6px; font: 700 15px/1 var(--f-plate); letter-spacing: .03em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }

/* ===== rotation timeline ===== */
.tl { background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--shadow-1); overflow: auto; max-height: calc(100vh - 230px); position: relative; }
.tl-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-width: 980px; }
.tl-h { position: sticky; top: 0; z-index: 3; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tl-hl { position: sticky; left: 0; z-index: 4; background: var(--surface-2); border-right: 1px solid var(--line); padding: 8px 12px; font-size: 12px; color: var(--ink-3); display: flex; align-items: flex-end; }
.tl-days { display: grid; }
.tl-day { text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 4px 0 5px; line-height: 1.15; border-left: 1px solid transparent; }
.tl-day b { display: block; font: 600 13px/1.1 var(--f-plate); color: var(--ink-2); }
.tl-day.we { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.tl-day.td { background: var(--brand); color: #fff; border-radius: 4px; }
.tl-day.td b { color: #fff; }
.tl-mon { font: 700 12px/1 var(--f-plate); letter-spacing: .05em; color: var(--ink-2); padding: 6px 0 0 4px; white-space: nowrap; }
.tl-name { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px 10px; display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
.tl-name:hover { background: var(--surface-2); }
.tl-name .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-name .sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row { position: relative; border-bottom: 1px solid var(--line); height: 44px; }
.tl-row .bg { position: absolute; inset: 0; display: grid; }
.tl-row .bg i { border-left: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.tl-row .bg i.we { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.tl-row .bg i.td { background: color-mix(in srgb, var(--brand) 9%, transparent); }
.seg-b { position: absolute; top: 11px; height: 22px; border-radius: 4px; background: var(--c); color: #fff; font: 600 12px/22px var(--f-plate); letter-spacing: .02em; padding: 0 6px; white-space: nowrap; overflow: hidden; cursor: pointer; }
.seg-b.plan { background: color-mix(in srgb, var(--c) 28%, var(--surface)); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent); }
.seg-b.over { box-shadow: inset -4px 0 0 var(--crit); }
.seg-b.dk { color: #12171D; }
.tl-group { position: sticky; left: 0; grid-column: 1 / -1; background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 6px 12px; font: 700 14px/1 var(--f-plate); letter-spacing: .03em; color: var(--ink-2); }
.tl-load { height: 52px; position: relative; border-bottom: 1px solid var(--line); }
.tl-load .lb { position: absolute; bottom: 4px; width: calc(100% - 4px); margin-left: 2px; }
.tl-load .col { position: absolute; bottom: 4px; border-radius: 3px 3px 0 0; background: var(--st-OFF); }
.tl-load .col.p { background: color-mix(in srgb, var(--st-OFF) 40%, var(--surface)); }

/* ===== drawer / modal / toast ===== */
.scrim { position: fixed; inset: 0; background: rgba(10,13,16,.42); z-index: 40; opacity: 0; transition: opacity .16s; }
.scrim.open { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); z-index: 41; box-shadow: var(--shadow-2); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.dhead { padding: 18px 18px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; border-bottom: 1px solid var(--line); position: relative; }
.dhead::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.dhead h3 { margin: 0; font: 700 26px/1.05 var(--f-plate); letter-spacing: .01em; }
.dhead .l2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 7px; }
.avwrap { position: relative; }
.avwrap .btn { position: absolute; right: -4px; bottom: -2px; border-radius: 50%; width: 34px; height: 34px; padding: 0; justify-content: center; box-shadow: var(--shadow-1); }
.dbody { flex: 1; overflow: auto; padding: 14px 18px 30px; }
.dsec { margin-top: 18px; }
.dsec:first-child { margin-top: 0; }
.dsec h4 { font: 700 15px/1 var(--f-plate); letter-spacing: .04em; color: var(--ink-2); margin: 0 0 9px; display: flex; align-items: center; gap: 8px; }
.now { border-radius: var(--r-panel); background: color-mix(in srgb, var(--c) 10%, var(--surface)); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.now .big { font: 700 22px/1.1 var(--f-plate); letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.now .big .st { font: 600 12.5px var(--f-ui); letter-spacing: 0; }
.now .prog { height: 6px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.acts .btn { justify-content: center; height: 38px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.form label.full, .form .full { grid-column: 1 / -1; }
.form .inp, .form .sel { width: 100%; }
.hist { display: flex; flex-direction: column; gap: 0; }
.hist .h { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding: 6px 0; font-size: 13px; }
.hist .h i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c, var(--ink-3)); }
.hist .h .t { font-size: 11.5px; color: var(--ink-3); }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -48%); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--surface); z-index: 51; border-radius: 14px; box-shadow: var(--shadow-2); display: flex; flex-direction: column; opacity: 0; transition: opacity .15s, transform .15s; }
.modal.wide { width: min(860px, calc(100vw - 24px)); }
.modal.open { opacity: 1; transform: translate(-50%, -50%); }
.modal .mh { padding: 16px 18px 10px; display: flex; align-items: center; gap: 10px; }
.modal .mh h3 { margin: 0; font: 700 23px/1.1 var(--f-plate); flex: 1; }
.modal .mb { padding: 4px 18px 16px; overflow: auto; }
.modal .mf { padding: 12px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.scrim.m { z-index: 50; }
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; background: var(--steel); color: var(--steel-ink); border-radius: 10px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-2); max-width: min(680px, calc(100vw - 30px)); font-size: 13.5px; }
.toast .btn { background: var(--steel-2); border-color: #3c4652; color: var(--steel-ink); }
.pick { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow: auto; padding: 2px; }
.jpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 300px; overflow: auto; padding: 2px; }
.jopt { border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.jopt b { font: 700 16px/1.1 var(--f-plate); }
.jopt span { font-size: 12px; color: var(--ink-3); }
.jopt.on { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 30%, transparent); }
.jopt .vac { color: var(--crit-ink); font-weight: 600; }
.note { font-size: 12.5px; color: var(--ink-3); }
.banner { display: flex; gap: 12px; align-items: center; border-radius: var(--r-panel); padding: 12px 14px; background: color-mix(in srgb, var(--warn) 16%, var(--surface)); margin-bottom: 16px; box-shadow: var(--shadow-1); flex-wrap: wrap; }
.banner .grow { flex: 1; min-width: 220px; }
.banner b { font-weight: 650; }
.drop-zone { border: 2px dashed var(--line-2); border-radius: var(--r-panel); padding: 22px; text-align: center; color: var(--ink-3); }
.drop-zone.hot { border-color: var(--focus); color: var(--ink); }

/* ===== agent ===== */
.agent { grid-area: agent; width: 380px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.agent.hidden { display: none; }
.ahead { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.ahead .aicon { width: 34px; height: 34px; border-radius: 9px; background: var(--steel); color: #fff; display: grid; place-items: center; position: relative; }
.ahead .aicon::after { content: ""; position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--surface); }
.ahead b { font: 700 18px/1 var(--f-plate); letter-spacing: .02em; display: block; }
.ahead span { font-size: 12px; color: var(--ink-3); }
.amsgs { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; font-size: 13.5px; line-height: 1.45; }
.msg.me { align-self: flex-end; background: var(--steel); color: var(--steel-ink); padding: 8px 12px; border-radius: 12px 12px 3px 12px; }
.msg.ai { align-self: flex-start; background: var(--surface-2); padding: 10px 12px; border-radius: 12px 12px 12px 3px; box-shadow: inset 0 0 0 1px var(--line); width: 92%; }
.msg.ai .ok { display: flex; gap: 8px; align-items: flex-start; }
.msg.ai .ok .ic { color: var(--good); margin-top: 1px; }
.msg.ai .warn .ic { color: #b57d00; }
.msg.ai p { margin: 0 0 6px; } .msg.ai p:last-child { margin-bottom: 0; }
.msg .mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg .mchips .chip { height: 28px; font-size: 12.5px; background: var(--surface); }
.msg .plist { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; max-height: 320px; overflow: auto; padding: 2px; }
.msg .mact { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.aquick { padding: 6px 14px 4px; display: flex; gap: 6px; overflow-x: auto; }
.aquick .chip { height: 28px; font-size: 12.5px; flex: none; }
.ainput { padding: 10px 12px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-end; }
.ainput textarea { flex: 1; resize: none; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); padding: 9px 11px; min-height: 40px; max-height: 120px; line-height: 1.35; }
.ainput textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.ainput .btn { height: 40px; width: 40px; padding: 0; justify-content: center; border-radius: 10px; }
.ainput .btn.rec { background: var(--crit); border-color: var(--crit); color: #fff; }
.fab { display: none; }

/* ===== responsive ===== */
@media (max-width: 1360px) {
  .agent { position: fixed; right: 0; top: 56px; bottom: 0; z-index: 30; box-shadow: var(--shadow-2); }
  .app { grid-template-columns: 84px minmax(0, 1fr); grid-template-areas: "top top" "rail main"; }
}
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .builtby { display: none; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr) 60px; grid-template-areas: "top" "main" "rail"; }
  .topbar { gap: 8px; padding-right: 8px; }
  .brand { font-size: 16px; padding: 0 10px; min-width: 0; }
  .apptitle span, .tclock span, .tbtn .lbl { display: none; }
  .apptitle { flex: 1; min-width: 0; overflow: hidden; }
  .apptitle b { overflow: hidden; text-overflow: ellipsis; }
  .apptitle b { font-size: 16px; }
  .tsearch { display: none; }
  .tsearch.mob { display: block; position: fixed; top: 56px; left: 8px; right: 8px; z-index: 30; }
  .tclock b { font-size: 17px; }
  .rail { flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 4px; overflow-x: auto; justify-content: space-around; }
  .rail button { padding: 6px 4px 4px; font-size: 10.5px; min-width: 52px; }
  .rail button.on::before { left: 12px; right: 12px; top: -4px; bottom: auto; height: 3px; width: auto; border-radius: 0 0 3px 3px; }
  .rail .sp, .rail .hide-m { display: none; }
  .view { padding: 14px 16px 90px; }
  .vhead h1 { font-size: 26px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .v { font-size: 32px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .jobgrid { grid-template-columns: minmax(0, 1fr); }
  .shifts { grid-template-columns: minmax(0, 1fr); }
  .shift + .shift { border-left: 0; border-top: 1px solid var(--line); }
  .crewgrid { grid-template-columns: minmax(0, 1fr); }
  .agent { top: 0; bottom: 0; left: 0; width: auto; z-index: 45; }
  .fab { display: grid; place-items: center; position: fixed; right: 16px; bottom: 76px; width: 54px; height: 54px; border-radius: 16px; background: var(--steel); color: #fff; border: 0; box-shadow: var(--shadow-2); z-index: 20; }
  .bar { grid-template-columns: 110px minmax(0, 1fr) 32px; }
  .filters .inp.q { width: 100%; }
  .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form { grid-template-columns: minmax(0, 1fr); }
  .tl { max-height: calc(100vh - 260px); }
  .tl-grid { grid-template-columns: 150px minmax(0, 1fr); }
}
@media (max-width: 480px) { .apptitle { display: none; } .tclock { margin-left: auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  body { overflow: visible; background: #fff; }
  .app { display: block; height: auto; }
  .rail, .agent, .topbar .tsearch, .topbar .tbtn, .fab, .tray, .qa, .jact { display: none !important; }
  .main { overflow: visible; }
  .job, .panel, .pcard { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
}

/* ===== TV mode ===== */
.tvwrap { position: fixed; inset: 0; background: #06080B; z-index: 100; display: grid; place-items: center; overflow: hidden; cursor: none; }
.tvwrap.ctl { cursor: default; }
.tv { width: 1920px; height: 1080px; flex: none; transform-origin: center center; background: #0E1217; color: #EEF2F5; display: grid; grid-template-rows: 96px 132px minmax(0, 1fr) 62px; font-family: var(--f-ui); position: relative; overflow: hidden; isolation: isolate;
  --st-JOB: #3987e5; --st-BASE: #c98500; --st-SUPPORT: #9085e9; --st-TRAINING: #d95926; --st-TRAVEL: #1f9a3f; --st-OFF: #199e70; --st-SICK: #d55181; --ink: #EEF2F5; --ink-2: #B9C2CC; --ink-3: #8A95A1; --surface: #161C23; --surface-2: #1C232B; --surface-3: #27303A; --line: #29323C; --crit-ink: #ff8f8f; --brand: #D10F0F; }
.tv::before { content: ""; position: absolute; inset: -25%; z-index: -1; pointer-events: none; background: radial-gradient(38% 30% at 18% 26%, rgba(209,15,15,.13), transparent 70%), radial-gradient(42% 34% at 82% 72%, rgba(57,135,229,.10), transparent 70%), radial-gradient(30% 26% at 60% 12%, rgba(25,158,112,.07), transparent 70%); animation: tvDrift 48s ease-in-out infinite alternate; }
@keyframes tvDrift { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 100% { transform: translate3d(-4%, 3%, 0) rotate(4deg); } }
.tv-top { display: flex; align-items: stretch; background: rgba(6,8,11,.82); border-bottom: 1px solid #222A33; }
.tv-brand { background: var(--brand); color: #fff; display: flex; align-items: center; padding: 0 34px; font: 700 40px/1 var(--f-plate); letter-spacing: .08em; position: relative; overflow: hidden; }
.tv-brand::after { content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -160px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); animation: tvShine 9s ease-in-out infinite; }
@keyframes tvShine { 0%, 70% { left: -160px; } 100% { left: 110%; } }
.tv-brand.has-logo { background: #fff; }
.tv-brand.has-logo::after { display: none; }
.tv-brand img { max-height: 58px; max-width: 320px; }
.tv-title { display: flex; flex-direction: column; justify-content: center; padding: 0 30px; }
.tv-title b { font: 700 42px/1 var(--f-plate); letter-spacing: .02em; }
.tv-title span { font-size: 19px; color: #9AA5B1; margin-top: 6px; }
.tv-peers { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 0 22px; }
.tv-livepill { display: inline-flex; align-items: center; gap: 9px; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(209,15,15,.16); color: #ff8a8a; font: 700 19px/1 var(--f-plate); letter-spacing: .12em; }
.tv-livepill i { width: 11px; height: 11px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 0 0 rgba(255,59,59,.6); animation: tvLive 1.8s ease-out infinite; }
.tv-livepill.local { background: #1D242C; color: #9AA5B1; }
.tv-livepill.local i { background: #6B7580; animation: none; }
@keyframes tvLive { 0% { box-shadow: 0 0 0 0 rgba(255,59,59,.55); } 70% { box-shadow: 0 0 0 12px rgba(255,59,59,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,59,0); } }
.tv-online { font-size: 19px; color: #C4CDD6; margin-right: 4px; }
.tv-pav { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: #27303A; color: #fff; font: 700 16px/1 var(--f-plate); box-shadow: 0 0 0 3px var(--pc, #6B7580); margin-left: -4px; }
.tv-pav img { width: 100%; height: 100%; object-fit: cover; }
.tv-clock { display: flex; align-items: center; gap: 22px; padding: 0 34px 0 18px; }
.tv-clock .t { font: 700 66px/1 var(--f-plate); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.tv-clock .t .colon { animation: tvColon 2s ease-in-out infinite; padding: 0 1px; }
@keyframes tvColon { 50% { opacity: .3; } }
.tv-clock .t small { font-size: 34px; color: #8A95A1; margin-left: 6px; }
.tv-clock .d { font-size: 22px; line-height: 1.25; color: #C4CDD6; text-align: right; }
.tv-kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; background: #1E252E; border-bottom: 1px solid #222A33; }
.tv-kpi { background: rgba(14,18,23,.94); padding: 18px 28px 14px; display: flex; flex-direction: column; justify-content: center; position: relative; }
.tv-kpi::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 6px; border-radius: 0 4px 4px 0; background: var(--c, #3A4552); }
.tv-kpi .k { font-size: 23px; color: #AEB8C3; display: flex; align-items: center; gap: 10px; }
.tv-kpi .k .ic { width: 26px; height: 26px; }
.tv-kpi .v { font: 700 72px/1 var(--f-plate); margin-top: 6px; letter-spacing: .01em; display: inline-block; transform-origin: left center; }
.tv-kpi.alert .v { color: #ff8f8f; }
.tv-kpi.alert::before { animation: tvBar 2.4s ease-in-out infinite; }
@keyframes tvBar { 50% { box-shadow: 0 0 18px 2px rgba(255,80,80,.55); } }
.tv-kpi.bump .v { animation: tvBump 1.1s cubic-bezier(.2,.8,.2,1); }
@keyframes tvBump { 0% { transform: scale(1); } 22% { transform: scale(1.14); text-shadow: 0 0 26px rgba(255,255,255,.45); } 100% { transform: scale(1); text-shadow: none; } }
.tv-main { position: relative; padding: 24px 34px 16px; min-height: 0; display: flex; flex-direction: column; }
.tv-ph { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; }
.tv-ph h2 { margin: 0; font: 700 44px/1 var(--f-plate); letter-spacing: .02em; }
.tv-ph h2.swap { animation: tvTitle .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes tvTitle { from { opacity: 0; transform: translateX(-28px); clip-path: inset(0 100% 0 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
.tv-ph .sub { font-size: 22px; color: #8D98A4; }
.tv-ph .dots { margin-left: auto; display: flex; gap: 8px; }
.tv-ph .dots i { width: 12px; height: 12px; border-radius: 50%; background: #2A333D; transition: background .4s, transform .4s; }
.tv-ph .dots i.done { background: #5C6672; }
.tv-ph .dots i.on { background: #fff; transform: scale(1.25); }
.tv-prog { height: 4px; border-radius: 2px; background: #1B2129; overflow: hidden; margin-bottom: 18px; }
.tv-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #ff6b6b); transform-origin: left center; transform: scaleX(0); }
@keyframes tvfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.tv-body { flex: 1; min-height: 0; position: relative; }
.tv-body.enter [data-st] { animation: tvRise .8s cubic-bezier(.16,.84,.24,1) both; animation-delay: calc(var(--i, 0) * 48ms + 60ms); }
@keyframes tvRise { from { opacity: 0; transform: translateY(34px) scale(.975); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.tv-body.leaving { animation: tvLeave .33s cubic-bezier(.5,0,.75,0) forwards; }
@keyframes tvLeave { to { opacity: 0; transform: translateY(-16px) scale(.99); } }
.tv-colw { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tv-jobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
.tv-job { background: #161C23; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px #242C35; }
.tv-job.has-open { box-shadow: 0 0 0 1px #4a2a2e; }
.tv-job .h { display: flex; align-items: center; gap: 14px; padding: 14px 16px 12px; background: #1C232B; }
.tv-job .no, .tv-need .no { width: 50px; height: 50px; border-radius: 9px; background: #0A0D11; display: grid; place-items: center; font: 700 28px/1 var(--f-plate); flex: none; }
.tv-job .tt, .tv-need .tt { font: 700 31px/1 var(--f-plate); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv-job .tt .wl { font-size: 22px; color: #8D98A4; }
.tv-job .ss, .tv-need .ss { font-size: 17px; color: #9AA5B1; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv-job .oc, .tv-need .oc { flex: none; font: 700 17px/1 var(--f-plate); letter-spacing: .06em; color: #ff9b9b; background: rgba(255,80,80,.14); border-radius: 6px; padding: 6px 8px; }
.tv-job .cr { padding: 10px 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.tv-job .col h5 { margin: 0 0 6px; font: 700 16px/1 var(--f-plate); letter-spacing: .08em; color: #8D98A4; display: flex; gap: 6px; align-items: center; }
.tv-job .col h5 .ic { width: 17px; height: 17px; }
.tv .av { background: #2A333D; color: #D3DAE2; box-shadow: 0 0 0 2px var(--c, transparent); }
.tv-p { display: flex; align-items: center; gap: 9px; padding: 5px 0; min-width: 0; }
.tv-p .av { width: 34px; height: 34px; font-size: 14px; }
.tv-p .n { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.tv-p .r { font: 600 15px/1 var(--f-plate); color: #8D98A4; letter-spacing: .04em; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.tv-p .flag { width: 24px; height: 16px; }
.tv-p.v .n { color: #ff8f8f; }
.tv-p.v .av { background: transparent; box-shadow: none; border: 2px dashed #8a4a4a; animation: tvVac 2.6s ease-in-out infinite; }
@keyframes tvVac { 0%, 100% { border-color: #7c4545; box-shadow: 0 0 0 0 rgba(255,90,90,0); } 50% { border-color: #ff6b6b; box-shadow: 0 0 0 7px rgba(255,90,90,.13); } }
.tv-needs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.tv-need { background: #161C23; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px #3a2629; }
.tv-need .h { display: flex; align-items: center; gap: 14px; padding: 14px 16px 12px; background: #1F1A1E; }
.nrow { display: grid; grid-template-columns: 22px 150px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #222A33; min-height: 66px; }

      nat: (a, b) => (a.nat || '').localeCompare(b.nat || '') || a.name.localeCompare(b.name),
      h: (a, b) => (a.h || 'Z').localeCompare(b.h || 'Z')
    }[f.sort] || ((a, b) => 0);
    return list.sort(key);
  }
  UI.filtered = filtered;
  const natList = () => [...new Set(SWT.DB.people.map(p => p.nat).filter(Boolean))].sort();
  const posList = () => [...new Set(SWT.DB.people.map(p => p.pos).filter(Boolean))].sort((a, b) => (SWT.POS_RANK[a] ?? 99) - (SWT.POS_RANK[b] ?? 99));
  const poolList = () => [...new Set(SWT.DB.people.map(p => p.pool).filter(Boolean))].sort();
  UI.natList = natList; UI.posList = posList;

  function statusChips(sel, act) {
    const c = SWT.counts();
    return SWT.STATUS_ORDER.filter(s => c[s] || sel.includes(s)).map(s => `<button class="chip ${sel.includes(s) ? 'on' : ''}" data-act="${act}" data-s="${s}"><span class="dot" style="--c:var(--st-${s})"></span>${SWT.STATUS[s].label}<span class="n">${c[s] || 0}</span></button>`).join('');
  }

  /* ===== views ===== */
  const VIEWS = UI.VIEWS = {};

  VIEWS.board = function () {
    const c = SWT.counts(), t = D.today(), DB = SWT.DB;
    const iss = SWT.issues();
    const nRet = iss.filter(i => i.type === 'returnPassed').length, nOut = iss.filter(i => i.type === 'outPassed').length;
    const parts = SWT.STATUS_ORDER.filter(s => c[s]).map(s => ({ s, n: c[s] }));
    const split = parts.map(x => `<div style="flex:${x.n};--c:var(--st-${x.s})" class="${x.s === 'BASE' ? 'dk' : ''}" title="${SWT.STATUS[x.s].label}: ${x.n}">${x.n / c.total > 0.06 ? x.n : ''}</div>`).join('');
    const jobs = DB.jobs.filter(j => j.status !== 'Closed');
    const in14 = DB.people.filter(p => !SWT.duty(p.status) && p.dateIn && p.dateIn >= t && p.dateIn <= D.add(t, 14)).sort((a, b) => a.dateIn.localeCompare(b.dateIn));
    const out14 = DB.people.filter(p => SWT.duty(p.status) && p.dateOut && !p.daily && p.dateOut >= t && p.dateOut <= D.add(t, 14)).sort((a, b) => a.dateOut.localeCompare(b.dateOut));
    const mv = (list, key, kind) => list.length ? list.map(p => `<div class="row click" data-act="person" data-pid="${p.id}"><span class="datebadge"><b>${+p[key].slice(8)}</b><span>${D.MON[+p[key].slice(5, 7) - 1]}</span></span>${av(p, 'sm')}<div class="grow"><div class="tt">${esc(p.name)}</div><div class="sub">${esc(SWT.abbr(p.pos))}, ${esc(kind === 'in' ? 'back ' + D.rel(p[key]) : SWT.locationText(p) + ', off ' + D.rel(p[key]))}</div></div>${SWT.flag(p.nat)}</div>`).join('') : `<div class="empty">Nobody in the next 14 days.${(nRet + nOut) ? ` ${nRet + nOut} dates have already passed, <button class="btn sm" data-act="nav" data-v="check">update them</button>` : ''}</div>`;
    const nat = {}; DB.people.forEach(p => { nat[p.nat || 'Unknown'] = (nat[p.nat || 'Unknown'] || 0) + 1; });
    const natRows = Object.entries(nat).sort((a, b) => b[1] - a[1]);
    const maxN = natRows[0] ? natRows[0][1] : 1;
    const pos = {}; DB.people.forEach(p => { pos[p.pos || 'Other'] = (pos[p.pos || 'Other'] || 0) + 1; });
    const posRows = Object.entries(pos).sort((a, b) => b[1] - a[1]).slice(0, 7);
    const maxP = posRows[0] ? posRows[0][1] : 1;
    const top = iss.filter(i => ['returnPassed', 'outPassed', 'vacant', 'noReturn'].includes(i.type));
    const grp = { returnPassed: 'Return date passed', outPassed: 'Days-off date passed', vacant: 'Open job slots', noReturn: 'Days off with no return date' };
    const gcount = {}; top.forEach(i => { gcount[i.type] = (gcount[i.type] || 0) + 1; });
    return `
      <div class="vhead"><div><h1>Crew board</h1><p>${D.fmt(t, { wd: 1, y: 1 })}, ${plural(c.total, 'person', 'people')} on the list, data from ${esc((DB.meta.source && DB.meta.source.sheet) ? 'planner ' + DB.meta.source.sheet : 'your updates')}</p></div><span class="grow"></span>
        <button class="btn" data-act="person-new">${ic('plus')}Add person</button><button class="btn" data-act="job-new">${ic('rig')}New job</button><button class="btn pri" data-act="tv">${ic('tv')}TV mode</button></div>
      ${(nRet + nOut) > 8 ? `<div class="banner">${ic('alert', 'lg')}<div class="grow"><b>${nRet + nOut} dates have passed and need an update.</b> ${nRet ? plural(nRet, 'person', 'people') + ' should be back from days off' : ''}${nRet && nOut ? ', ' : ''}${nOut ? plural(nOut, 'person', 'people') + ' passed their days-off date' : ''}. The planner sheet is from ${esc(DB.meta.source ? D.fmt(DB.meta.source.date, { y: 1 }) : 'an older date')}.</div><button class="btn dark" data-act="nav" data-v="check">Review now</button></div>` : ''}
      <div class="kpis">
        <button class="kpi" data-act="crew-filter" data-s=""><span class="k">${ic('users', 'sm')}Total crew</span><span class="v">${c.total}</span><span class="s">${c.onDuty} on duty</span></button>
        <button class="kpi" data-act="crew-filter" data-s="JOB"><span class="k"><span class="dot" style="--c:var(--st-JOB)"></span>On job</span><span class="v">${c.JOB}</span><span class="s">${c.day} day, ${c.night} night</span></button>
        <button class="kpi" data-act="crew-filter" data-s="BASE"><span class="k"><span class="dot" style="--c:var(--st-BASE)"></span>At base</span><span class="v">${c.BASE}</span><span class="s">${c.SUPPORT} in office</span></button>
        <button class="kpi" data-act="crew-filter" data-s="OFF"><span class="k"><span class="dot" style="--c:var(--st-OFF)"></span>Days off</span><span class="v">${c.OFF}</span><span class="s">${c.SICK ? c.SICK + ' sick' : 'none sick'}</span></button>
        <button class="kpi" data-act="nav" data-v="rotation"><span class="k">${ic('arrIn', 'sm')}Back in 7 days</span><span class="v">${c.back7}</span><span class="s">${c.out7} going off in 7 days</span></button>
        <button class="kpi ${c.vacant ? 'alert' : ''}" data-act="nav" data-v="jobs"><span class="k">${ic('alert', 'sm')}Open slots</span><span class="v">${c.vacant}</span><span class="s">${jobs.length} active jobs</span></button>
      </div>
      <div class="panel" style="margin-bottom:16px"><h2>Where everyone is<span class="grow"></span><small>${c.total} people, tap a face to open</small></h2>
        <div class="splitbar" role="img" aria-label="${parts.map(x => SWT.STATUS[x.s].label + ' ' + x.n).join(', ')}">${split}</div>
        <div class="legend" style="margin-bottom:14px">${parts.map(x => `<span><i style="--c:var(--st-${x.s})"></i>${SWT.STATUS[x.s].label} ${x.n}</span>`).join('')}</div>
        <div class="wall">${wallHTML()}</div></div>
      <div class="grid2">
        <div class="panel"><h2>${ic('rig')}Jobs<span class="grow"></span><button class="btn sm ghost" data-act="nav" data-v="jobs">Open jobs board</button></h2><div class="rows">
          ${jobs.map(j => { const f = j.slots.filter(s => s.pid).length, n = j.slots.length; return `<div class="row click" data-act="job-open" data-jid="${j.id}"><span class="jno ${j.no ? '' : 'x'}" style="width:36px;height:36px;font-size:18px">${j.no || ic('rig', 'sm')}</span><div class="grow"><div class="tt">${esc(SWT.jobTitle(j))}${j.rig && j.well ? ` <span class="muted" style="font-weight:400">${esc(j.well)}</span>` : ''}</div><div class="sub">${esc([j.unit, j.client].filter(Boolean).join(', '))}${j.mob ? ', day ' + (D.diff(t, j.mob) + 1) : ''}</div></div><span class="meter" title="${f} of ${n} slots filled"><i style="width:${n ? f / n * 100 : 0}%"></i></span><span class="num" style="width:44px;text-align:right">${f}/${n}</span>${n - f ? `<span class="cd over">${n - f} open</span>` : '<span class="cd" style="width:52px"></span>'}</div>`; }).join('') || '<div class="empty">No active jobs. Create one with New job.</div>'}
        </div></div>
        <div class="panel"><h2>${ic('calendar')}Movements, next 14 days</h2>
          <div class="groupttl" style="margin-top:0">${ic('arrIn', 'sm')}Coming back<span class="n">${in14.length}</span></div><div class="rows">${mv(in14, 'dateIn', 'in')}</div>
          <div class="groupttl">${ic('arrOut', 'sm')}Going on days off<span class="n">${out14.length}</span></div><div class="rows">${mv(out14, 'dateOut', 'out')}</div>
        </div>
        <div class="panel"><h2>${ic('shield')}Needs attention<span class="grow"></span><button class="btn sm ghost" data-act="nav" data-v="check">See all</button></h2>
          ${Object.keys(gcount).length ? Object.entries(gcount).map(([k, n]) => `<div class="issue">${ic('alert', k === 'vacant' ? 'warn' : 'crit')}<div class="grow" style="flex:1"><b>${n}</b> ${grp[k]}</div><button class="btn sm" data-act="nav" data-v="check">Review</button></div>`).join('') : '<div class="empty">All clear. Dates and slots are up to date.</div>'}
        </div>
        <div class="panel"><h2>${ic('users')}Crew mix</h2>
          <div class="bars">${natRows.map(([k, n]) => `<div class="bar" title="${esc(k)}: ${n}"><span class="lb">${SWT.flag(k)}${esc(k)}</span><span class="tr"><span class="fl" style="width:${n / maxN * 100}%"></span></span><span class="vl">${n}</span></div>`).join('')}</div>
          <div class="groupttl">By position</div>
          <div class="bars">${posRows.map(([k, n]) => `<div class="bar"><span class="lb">${esc(k)}</span><span class="tr"><span class="fl" style="width:${n / maxP * 100}%"></span></span><span class="vl">${n}</span></div>`).join('')}</div>
        </div>
      </div>`;
  };

  function wallAv(p) { const ph = SWT.store.photos.get(p.id); return `<button class="wa" data-act="person" data-pid="${p.id}" style="--c:var(--st-${p.status})" title="${esc(p.name)}, ${esc(SWT.abbr(p.pos))}${p.nat ? ', ' + esc(p.nat) : ''}">${ph ? `<img src="${ph}" alt="">` : esc(initials(p.name))}</button>`; }
  function wallHTML() {
    const groups = [];
    for (const j of SWT.DB.jobs.filter(x => x.status !== 'Closed')) {
      const ps = j.slots.filter(s => s.pid).map(s => SWT.person(s.pid)).filter(Boolean), open = j.slots.filter(s => !s.pid).length;
      groups.push({ t: SWT.jobTitle(j), sub: j.no ? '#' + j.no : '', ps, s: 'JOB', jid: j.id, open });
    }
    [['BASE', SWT.DB.settings.baseName], ['SUPPORT', 'Office'], ['TRAINING', 'Training'], ['TRAVEL', 'Travel'], ['OFF', 'Days off'], ['SICK', 'Sick']].forEach(([s, t]) => {
      const ps = SWT.DB.people.filter(p => p.status === s); if (ps.length) groups.push({ t, ps: s === 'OFF' ? ps.sort((a, b) => (a.dateIn || '9').localeCompare(b.dateIn || '9')) : ps, s });
    });
    let k = 0;
    return groups.map(g => `<div class="wg wg-${g.s}" style="--c:var(--st-${g.s})" ${g.jid ? `data-act="job-open" data-jid="${g.jid}"` : `data-act="crew-filter" data-s="${g.s}"`}>
      <div class="wg-h"><b>${esc(g.t)}</b><span>${g.ps.length}${g.open ? ` <em>+${g.open} open</em>` : ''}</span></div>
      <div class="wg-f">${g.ps.map(p => wallAv(p).replace('<button class="wa"', `<button style="--k:${k++}" class="wa"`)).join('')}${g.open ? '<i class="wa vac"></i>'.repeat(g.open) : ''}</div></div>`).join('');
  }
  UI.wallHTML = wallHTML;

  VIEWS.crew = function () {
    const f = UI.f;
    const list = filtered();
    const natOpts = natList().map(n => `<option ${f.nat === n ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const posOpts = posList().map(n => `<option ${f.pos === n ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const poolOpts = poolList().map(n => `<option ${f.pool === n ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const body = !list.length ? `<div class="empty panel">No one matches these filters. <button class="btn sm" data-act="crew-clear">Clear filters</button></div>`
      : f.mode === 'table' ? crewTable(list) : `<div class="crewgrid ${UI.bulk ? 'bulk' : ''}">${list.map(pcard).join('')}</div>`;
    return `
      <div class="vhead"><div><h1>Crew</h1><p>${list.length === SWT.DB.people.length ? plural(list.length, 'person', 'people') : `${list.length} of ${SWT.DB.people.length} shown`}</p></div><span class="grow"></span>
        <button class="btn ${UI.bulk ? 'dark' : ''}" data-act="bulk">${ic('check')}${UI.bulk ? 'Done selecting' : 'Select'}</button>
        <button class="btn" data-act="photos-bulk">${ic('image')}Add photos</button>
        <button class="btn pri" data-act="person-new">${ic('plus')}Add person</button>
        <span class="seg"><button class="${f.mode === 'grid' ? 'on' : ''}" data-act="crew-mode" data-m="grid" aria-label="Cards">${ic('grid', 'sm')}</button><button class="${f.mode === 'table' ? 'on' : ''}" data-act="crew-mode" data-m="table" aria-label="Table">${ic('list', 'sm')}</button></span></div>
      <div class="filters">
        <input class="inp q" id="crewq" placeholder="Search name, H number, rig, phone" value="${esc(f.q)}" data-in="crew-q">
        <div class="chips">${statusChips(f.st, 'crew-st')}</div>
        <select class="sel" data-ch="crew-nat"><option value="">All nationalities</option>${natOpts}</select>
        <select class="sel" data-ch="crew-pos"><option value="">All positions</option>${posOpts}</select>
        ${poolList().length > 1 ? `<select class="sel" data-ch="crew-pool"><option value="">All pools</option>${poolOpts}</select>` : ''}
        <select class="sel" data-ch="crew-sort" title="Sort">${[['status', 'Sort: status and job'], ['name', 'Sort: name'], ['ret', 'Sort: return date'], ['out', 'Sort: days-off date'], ['pos', 'Sort: position'], ['nat', 'Sort: nationality'], ['h', 'Sort: H number']].map(([v, l]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${(f.q || f.st.length || f.nat || f.pos || f.pool) ? `<button class="btn ghost sm" data-act="crew-clear">${ic('x', 'sm')}Clear</button>` : ''}
      </div>
      ${body}
      ${UI.bulk ? `<div class="bulkbar"><b>${UI.sel.size} selected</b>
        <button class="btn sm" data-act="sel-all">Select all shown</button>
        <button class="btn sm" data-act="bulk-off" ${UI.sel.size ? '' : 'disabled'}>${ic('home', 'sm')}Days off</button>
        <button class="btn sm" data-act="bulk-back" ${UI.sel.size ? '' : 'disabled'}>${ic('arrIn', 'sm')}Back on duty</button>
        <button class="btn sm" data-act="bulk-base" ${UI.sel.size ? '' : 'disabled'}>${ic('base', 'sm')}To base</button>
        <button class="btn sm" data-act="bulk-assign" ${UI.sel.size ? '' : 'disabled'}>${ic('rig', 'sm')}Assign</button>
        <button class="btn sm" data-act="sel-none">Clear</button></div>` : ''}`;
  };
  function crewTable(list) {
    return `<div style="overflow:auto;border-radius:10px"><table class="tbl"><thead><tr>${[['name', 'Name'], ['h', 'H number'], ['pos', 'Position'], ['nat', 'Nationality'], ['status', 'Status'], ['status', 'Location / job'], ['out', 'Days off'], ['ret', 'Return'], ['', 'Phone']].map(([k, l]) => `<th data-act="${k ? 'crew-sortby' : ''}" data-k="${k}">${l}${UI.f.sort === k && k ? ' ▾' : ''}</th>`).join('')}</tr></thead><tbody>
      ${list.map(p => { const a = SWT.assignment(p); return `<tr data-act="person" data-pid="${p.id}"><td><span style="display:inline-flex;align-items:center;gap:8px">${av(p, 'xs')}<b>${esc(p.name)}</b></span></td><td>${hno(p)}</td><td>${esc(p.pos || '')}</td><td><span style="display:inline-flex;gap:6px;align-items:center">${SWT.flag(p.nat)}${esc(p.nat || '')}</span></td><td>${stPill(p.status)}</td><td>${esc(SWT.locationText(p))}${a ? ` <span class="muted">${a.slot.shift === 'N' ? 'night' : 'day'}</span>` : ''}</td><td class="num">${SWT.duty(p.status) ? D.fmt(p.dateOut, { autoY: 1 }) : D.fmt(p.offStart, { autoY: 1 })}</td><td class="num">${SWT.duty(p.status) ? (p.lastResume ? '<span class="muted">since ' + D.fmt(p.lastResume, { autoY: 1 }) + '</span>' : '–') : D.fmt(p.dateIn, { autoY: 1 })}</td><td class="num">${esc(p.phone || '')}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }

  /* jobs */
  function slotHTML(j, s) {
    const p = s.pid ? SWT.person(s.pid) : null;
    return `<div class="slot ${p ? '' : 'vac'}" data-drop="slot" data-jid="${j.id}" data-sid="${s.id}">
      <span class="sp" title="${esc(s.pos)}">${esc(SWT.abbr(s.pos))}</span>
      ${p ? plate(p, { slot: true, drag: true }) : `<button class="open" data-act="slot-fill" data-jid="${j.id}" data-sid="${s.id}">${ic('plus', 'sm')}Open slot, tap to fill</button>`}
      <button class="btn xs icon sx" data-act="slot-del" data-jid="${j.id}" data-sid="${s.id}" title="Remove this slot" aria-label="Remove slot">${ic('x', 'sm')}</button>
    </div>`;
  }
  function jobHTML(j) {
    const t = D.today(), f = j.slots.filter(s => s.pid).length, n = j.slots.length;
    const dsl = j.slots.filter(s => s.shift === 'D'), nsl = j.slots.filter(s => s.shift === 'N');
    const closed = j.status === 'Closed';
    return `<article class="job ${closed ? 'closed' : ''}" id="job-${j.id}">
      <div class="jhead">
        <span class="jno ${j.no ? '' : 'x'}">${j.no || ic('rig')}</span>
        <div class="jttl">${esc(SWT.jobTitle(j))}${j.rig && j.well ? `<small>${esc(j.well)}${j.wells && j.wells.length ? ' + ' + esc(j.wells.join(', ')) : ''}</small>` : ''}</div>
        <div class="jact"><button class="btn sm icon ghost" data-act="job-edit" data-jid="${j.id}" title="Edit job" aria-label="Edit job">${ic('edit', 'sm')}</button>
        ${closed ? `<button class="btn sm" data-act="job-reopen" data-jid="${j.id}">Re-open</button>` : `<button class="btn sm icon ghost" data-act="job-close" data-jid="${j.id}" title="Close job and release crew" aria-label="Close job">${ic('x', 'sm')}</button>`}</div>
        <div class="jsub">${esc([j.unit, j.client].filter(Boolean).join(', '))}</div>
      </div>
      <div class="jmeta"><span>MOB <b>${j.mob ? D.fmt(j.mob, { autoY: 1 }) : esc(j.mobNote || 'TBC')}</b>${j.mob ? ` (day ${D.diff(t, j.mob) + 1})` : ''}</span><span>Crew <b>${f}/${n}</b></span>${n - f ? `<span class="cd over">${ic('alert', 'sm')}${n - f} open</span>` : (n ? '<span class="cd" style="color:var(--good-ink)">' + ic('check', 'sm') + 'Fully crewed</span>' : '')}${closed ? `<span>Closed ${D.fmt(j.closed)}</span>` : ''}</div>
      ${closed ? '' : `<div class="shifts">
        ${[['D', 'Day', 'sun', dsl], ['N', 'Night', 'moon', nsl]].map(([k, l, i, list]) => `<div class="shift" data-drop="shift" data-jid="${j.id}" data-shift="${k}"><h4>${ic(i, 'sm')}${l}<span class="n">${list.filter(s => s.pid).length}/${list.length}</span></h4>${list.map(s => slotHTML(j, s)).join('')}<button class="btn xs ghost" data-act="slot-add" data-jid="${j.id}" data-shift="${k}" style="align-self:flex-start">${ic('plus', 'sm')}Add slot</button></div>`).join('')}
      </div>`}
      ${j.equipment && j.equipment.length ? `<details class="eqd"><summary class="jfoot" style="cursor:pointer">${ic('file', 'sm')}${plural(j.equipment.length, 'equipment line')}</summary><div class="eqlist">${j.equipment.map(e => `<span class="eq">${esc(e)}</span>`).join('')}</div></details>` : ''}
    </article>`;

  UI.jobHTML = jobHTML;
  VIEWS.jobs = function () {
    const all = SWT.DB.jobs;
    const list = all.filter(j => UI.jf === 'All' || (UI.jf === 'Closed' ? j.status === 'Closed' : j.status !== 'Closed'));
    const base = SWT.DB.people.filter(p => p.status === 'BASE').sort((a, b) => (SWT.POS_RANK[a.pos] ?? 99) - (SWT.POS_RANK[b.pos] ?? 99) || a.name.localeCompare(b.name));
    const vac = SWT.vacancies().length;
    return `
      <div class="vhead"><div><h1>Jobs</h1><p>${plural(all.filter(j => j.status !== 'Closed').length, 'active job')}, ${plural(vac, 'open slot')}. Drag a name onto a slot to assign.</p></div><span class="grow"></span>
        <span class="seg">${['Active', 'Closed', 'All'].map(k => `<button class="${UI.jf === k ? 'on' : ''}" data-act="jobs-filter" data-k="${k}">${k}</button>`).join('')}</span>
        <button class="btn pri" data-act="job-new">${ic('plus')}New job</button></div>
      <div class="tray" data-drop="base"><h3>${ic('base', 'sm')}Available at ${esc(SWT.DB.settings.baseName)}<span class="muted" style="font:400 13px var(--f-ui)">${base.length}, drop a name here to release to base</span></h3>

      <div class="jobgrid">${list.map(jobHTML).join('') || '<div class="empty panel">No jobs here.</div>'}</div>`;
  };

  /* rotation */
  VIEWS.rotation = function () {
    const R = UI.rot, t = D.today();
    if (!R.start) R.start = D.add(t, -7);
    const days = R.weeks * 7, start = R.start, end = D.add(start, days - 1);
    const dayArr = Array.from({ length: days }, (_, i) => D.add(start, i));
    const cols = `repeat(${days}, minmax(22px, 1fr))`;
    const f = { q: R.q, st: R.st, nat: '', pos: '', pool: '', sort: 'status' };

    document.body.append(scrim, m);
    requestAnimationFrame(() => { scrim.classList.add('open'); m.classList.add('open'); });
    const close = () => { scrim.remove(); m.remove(); document.removeEventListener('keydown', esc_); o.onClose && o.onClose(); };
    const esc_ = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    document.addEventListener('keydown', esc_);

  /* ===== dialogs ===== */
  function daysOffDialog(pids, preset = {}) {
    const ps = pids.map(SWT.person).filter(Boolean); if (!ps.length) return;
    const t = D.today(), rot = SWT.rotOf(ps[0]), p0 = ps[0];
    const planned = ps.length === 1 && p0.planIn && p0.dateOut && SWT.duty(p0.status);
    const start0 = preset.start || (planned ? (p0.dateOut < t ? t : p0.dateOut) : t);
    const days0 = preset.days || (planned ? Math.max(1, D.diff(p0.planIn, p0.dateOut)) : rot.off);
    const onJob = ps.filter(p => SWT.assignment(p));
    const md = modal({
      title: ps.length === 1 ? `Days off for ${ps[0].name}` : `Days off for ${ps.length} people`,
      body: `<div class="form">
        <label>First day off<input class="inp" type="date" name="start" value="${start0}" autofocus></label>
        <label>Number of days<input class="inp" type="number" name="days" min="1" max="200" value="${days0}"></label>
        <label>Back on<input class="inp" type="date" name="end" value="${D.add(start0, days0)}"></label>
        <label>Rotation rule<span class="note" style="padding-top:8px">${ps.length === 1 ? `${rot.off} days off (${SWT.group(ps[0]) === 'L' ? 'local' : 'expat'})` : 'Each person keeps the dates above'}</span></label>
      </div>
      ${onJob.length ? `<p class="note" style="margin:12px 0 0">${ic('alert', 'sm')} ${onJob.map(p => { const a = SWT.assignment(p); return esc(p.name) + ' leaves ' + esc(SWT.jobTitle(a.job)) + ' ' + (a.slot.shift === 'N' ? 'night' : 'day') + ' ' + esc(SWT.abbr(a.slot.pos)); }).join('; ')}. The slot${onJob.length > 1 ? 's' : ''} will show as open.</p>` : ''}
      <p class="note" data-plan style="margin:8px 0 0"></p>`,
      foot: `<button class="btn" data-x2>Cancel</button><button class="btn pri" data-ok>${ic('home', 'sm')}<span>Start days off</span></button>`,
      onOpen(m, close) {
        const f = n => m.querySelector(`[name=${n}]`);
        const upd = src => {
          const s = f('start').value, n = +f('days').value || 1;
          if (src === 'end' && D.valid(f('end').value) && D.valid(s)) f('days').value = Math.max(1, D.diff(f('end').value, s));
          else if (D.valid(s)) f('end').value = D.add(s, n);
          const future = D.valid(s) && s > t;
          m.querySelector('[data-ok] span').textContent = future ? 'Plan days off' : 'Start days off';
          m.querySelector('[data-plan]').textContent = future ? 'The start date is in the future, so this is saved as planned days off. Status changes on the day.' : '';
        };
        f('start').oninput = () => upd('start'); f('days').oninput = () => upd('days'); f('end').oninput = () => upd('end'); upd();
        m.querySelector('[data-x2]').onclick = close;
        m.querySelector('[data-ok]').onclick = () => {
          const start = f('start').value, end = f('end').value;
          if (!D.valid(start) || !D.valid(end) || end <= start) { toast('Check the dates: return must be after the first day off.'); return; }
          close();
          act(ps.length === 1 ? 'Days off: ' + ps[0].name : `Days off for ${ps.length} people`, () => {
            const rs = ps.map(p => OPS.daysOff(p, { start, end }));
            return { pids: ps.map(p => p.id), msg: ps.length === 1 ? rs[0].msg : `${ps.length} people on days off from ${D.fmt(start)}, back ${D.fmt(end)}.` };
          }, { kind: 'off' });
          UI.bulk && (UI.sel.clear());
        };
      }
    });
  }
  UI.daysOffDialog = daysOffDialog;

    let jid = preset.jid || (SWT.assignment(ps[0]) ? null : (ps[0].lastJob && SWT.job(ps[0].lastJob) && SWT.job(ps[0].lastJob).status !== 'Closed' ? ps[0].lastJob : null)) || null;

    const posOpts = SWT.POSITIONS.map(n => `<option>${esc(n)}</option>`).join('');
    const md = modal({
      title: ps.length === 1 ? `Assign ${ps[0].name}` : `Assign ${ps.length} people`, wide: true,
      body: `<input class="inp" placeholder="Filter jobs" data-jq style="width:100%;margin-bottom:10px"><div class="jpick" data-jobs></div>

        <p class="note" data-prev style="margin:10px 0 0"></p>`,
      foot: `<button class="btn" data-x2>Cancel</button><button class="btn pri" data-ok>${ic('rig', 'sm')}Assign</button>`,
      onOpen(m, close) {

          const q = (m.querySelector('[data-jq]').value || '').toLowerCase();
          m.querySelector('[data-jobs]').innerHTML = jobs.filter(j => !q || [j.rig, j.well, j.unit, j.client, j.no].join(' ').toLowerCase().includes(q)).map(j => { const v = j.slots.filter(s => !s.pid).length; return `<button class="jopt ${jid === j.id ? 'on' : ''}" data-j="${j.id}"><b>${j.no ? '#' + j.no + ' ' : ''}${esc(SWT.jobTitle(j))}</b><span>${esc([j.unit, j.client].filter(Boolean).join(', '))}</span><span class="${v ? 'vac' : ''}">${v ? v + ' open: ' + esc(j.slots.filter(s => !s.pid).map(s => (s.shift === 'N' ? 'N ' : 'D ') + SWT.abbr(s.pos)).join(', ')) : 'Fully crewed'}</span></button>`; }).join('');
          prev();

          const hit = free.find(s => s.pos === pos) || free.find(s => SWT.compatible(s.pos, pos));
          el.textContent = ps.length > 1 ? `${ps.length} people will be placed on ${SWT.jobTitle(j)}, filling open slots first.` : hit ? `Fills the open ${hit.shift === 'N' ? 'night' : 'day'} ${hit.pos} slot on ${SWT.jobTitle(j)}.` : `No open ${pos} slot on ${SWT.jobTitle(j)}${shift ? ' for that shift' : ''}, a new slot will be added.`;

        m.querySelector('[data-jq]').oninput = draw;
        m.querySelector('[data-jobs]').onclick = e => { const b = e.target.closest('[data-j]'); if (b) { jid = b.dataset.j; draw(); } };
        m.querySelector('[data-shift]').onclick = e => { const b = e.target.closest('button'); if (!b) return; shift = b.dataset.v; $$('button', b.parentNode).forEach(x => x.classList.toggle('on', x === b)); prev(); };

          UI.sel.clear();
        };
        draw();
      }
    });
